name: Conserto Geral (Nomes e Capas)

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos arquivos verificar por run'
        required: false
        default: '1000'
        type: string

permissions:
  contents: write

concurrency:
  group: conserto-geral
  cancel-in-progress: false

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Verificar e consertar nomes e capas
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LOTE_SIZE: ${{ inputs.lote || '1000' }}
        run: |
          cat > /tmp/conserto_geral.py << 'PYEOF'
          import requests, re, os, sys, json, time, unicodedata
          from pathlib import Path
          from bs4 import BeautifulSoup

          API_KEY = os.environ.get("TMDB_API_KEY")
          LOTE_SIZE = int(os.environ.get('LOTE_SIZE', 1000))
          TMDB_API = "https://api.themoviedb.org/3"
          IMG_BASE = "https://image.tmdb.org/t/p/w500"

          if not API_KEY:
              print("ERRO: TMDB_API_KEY não configurada!")
              sys.exit(1)

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def strip_accents(s):
              return ''.join(c for c in unicodedata.normalize('NFD', s) if unicodedata.category(c) != 'Mn')

          def limpar_nome_arquivo(nome_arquivo):
              nome = nome_arquivo.replace('.html', '')
              nome = re.sub(r'_t\d+e\d+', '', nome, flags=re.I)
              
              # Remove lixos
              lixo_regex = r'_(acaocomedia|comediaanimacao|infantilaventura|terrormisterio|legendado|dublado|hdcam|webdl|bluray|comedia|infantil|aventura|thriller|suspense|terror|acao|romance|drama|misterio|guerra|documentario|anime|animacao|fantasia|familia|crime|historia|musica|novela|reality|talk_show|podcast)\w*'
              nome = re.sub(lixo_regex, '', nome, flags=re.I)
              
              nome = re.sub(r'_(?:19|20)\d{2}', '', nome)
              nome = re.sub(r'_\d+$', '', nome)
              nome = re.sub(r'_html|_inix|_entre_nos', '', nome, flags=re.I)
              
              nome = nome.replace('_', ' ').strip()
              nome = re.sub(r'\s+', ' ', nome)
              return nome.title()

          def buscar_capa_tmdb(titulo):
              params = {"api_key": API_KEY, "query": titulo, "language": "pt-BR"}
              try:
                  r = requests.get(f"{TMDB_API}/search/multi", params=params, timeout=10)
                  dados = r.json().get("results", [])
                  for d in dados:
                      if d.get('media_type') in ['movie', 'tv'] and d.get('poster_path'):
                          return d['poster_path']
              except: pass

              titulo_sem_acento = strip_accents(titulo)
              if titulo != titulo_sem_acento:
                  params["query"] = titulo_sem_acento
                  try:
                      r = requests.get(f"{TMDB_API}/search/multi", params=params, timeout=10)
                      dados = r.json().get("results", [])
                      for d in dados:
                          if d.get('media_type') in ['movie', 'tv'] and d.get('poster_path'):
                              return d['poster_path']
                  except: pass
              return None

          def buscar_capa_imdb(imdb_id):
              try:
                  r = requests.get(f"{TMDB_API}/find/{imdb_id}?external_source=imdb_id&api_key={API_KEY}&language=pt-BR", timeout=10)
                  dados = r.json()
                  if dados.get("movie_results"):
                      return dados["movie_results"][0].get("poster_path")
                  if dados.get("tv_results"):
                      return dados["tv_results"][0].get("poster_path")
                  if dados.get("tv_episode_results"):
                      show_id = dados["tv_episode_results"][0].get("show_id")
                      if show_id:
                          r_show = requests.get(f"{TMDB_API}/tv/{show_id}?api_key={API_KEY}&language=pt-BR", timeout=10)
                          return r_show.json().get("poster_path")
              except: pass
              return None

          def main():
              arquivos = list(Path(".").glob("*.html"))
              log(f"Analisando {len(arquivos)} arquivos HTML...")
              
              processados = 0
              consertados = 0
              deletados = 0

              for f in arquivos:
                  if processados >= LOTE_SIZE:
                      log(f"Lote de {LOTE_SIZE} atingido. Parando por hoje.")
                      break

                  try:
                      conteudo = f.read_text(encoding="utf-8")
                      soup = BeautifulSoup(conteudo, 'html.parser')
                      
                      script_ld = soup.find('script', type='application/ld+json')
                      if not script_ld: continue
                      
                      try: dados = json.loads(script_ld.string)
                      except: continue

                      nome_atual = dados.get('name', '')
                      video_link = dados.get('contentUrl', '')
                      
                      # 1. Verifica se o NOME está quebrado
                      is_broken_name = False
                      if not nome_atual or len(nome_atual) < 3: is_broken_name = True
                      if "http" in nome_atual or "desconhecid" in nome_atual.lower(): is_broken_name = True
                      if re.match(r'^\d{4}\s*-', nome_atual): is_broken_name = True
                      
                      # 2. Verifica se a CAPA está quebrada
                      capa_atual = dados.get('thumbnailUrl', [''])[0] if dados.get('thumbnailUrl') else ''
                      is_broken_cover = "placeholder" in capa_atual or "Sem+Capa" in capa_atual or not capa_atual

                      # Se estiver tudo ok, pula
                      if not is_broken_name and not is_broken_cover:
                          continue
                          
                      # Deleta lixos conhecidos
                      if any(x in f.name for x in ["catalogo", "serie_desconhecida", "index", "blog_post", "contexthttp", "html_2025", "service_unavailable"]):
                          f.unlink()
                          deletados += 1
                          continue

                      processados += 1
                      log(f"[{processados}/{LOTE_SIZE}] Analisando: {f.name} (Nome quebrado: {is_broken_name}, Capa quebrada: {is_broken_cover})")
                      
                      novo_nome_json = nome_atual
                      nova_capa = capa_atual
                      match_imdb = re.search(r'(tt\d{7,9})', conteudo)

                      # 1. Conserta o Nome
                      if is_broken_name:
                          titulo_limpo = limpar_nome_arquivo(f.name)
                          if match_imdb:
                              capa_temp = buscar_capa_imdb(match_imdb.group(1))
                              # Se achou pelo IMDB, vamos buscar o nome real tbm
                              if capa_temp:
                                  # Busca o nome usando o IMDB
                                  try:
                                      r = requests.get(f"{TMDB_API}/find/{match_imdb.group(1)}?external_source=imdb_id&api_key={API_KEY}&language=pt-BR", timeout=10)
                                      d = r.json()
                                      if d.get("movie_results"):
                                          m = d["movie_results"][0]
                                          ano = m.get("release_date", "")[:4]
                                          novo_nome_json = f"{m.get('title')} ({ano}) - 🍿Clau" if ano else f"{m.get('title')} - 🍿Clau"
                                      elif d.get("tv_results"):
                                          t = d["tv_results"][0]
                                          novo_nome_json = f"{t.get('name')} - 🍿Clau"
                                  except: pass
                          
                          if novo_nome_json == nome_atual: # Se não achou via imdb, usa o nome do arquivo
                              novo_nome_json = f"{titulo_limpo} - 🍿Clau"
                          
                          log(f"  [+] Nome corrigido para: {novo_nome_json}")

                      # 2. Conserta a Capa
                      if is_broken_cover or (is_broken_name and not nova_capa):
                          titulo_para_busca = re.sub(r'\s*-\s*🍿Clau', '', novo_nome_json)
                          titulo_para_busca = re.sub(r'\s*\(.*?\)', '', titulo_para_busca).strip()
                          
                          log(f"  [~] Buscando capa para: '{titulo_para_busca}'")
                          poster_path = buscar_capa_tmdb(titulo_para_busca)
                          
                          if not poster_path and match_imdb:
                              log(f"  [~] Busca por nome falhou. Tentando IMDB...")
                              poster_path = buscar_capa_imdb(match_imdb.group(1))
                              
                          if poster_path:
                              nova_capa = IMG_BASE + poster_path
                              log(f"  [+] Capa encontrada: {nova_capa}")
                          else:
                              log(f"  [-] Capa não encontrada.")

                      # Se não conseguiu nem nome nem capa, pula
                      if novo_nome_json == nome_atual and nova_capa == capa_atual:
                          continue

                      # Aplica as mudanças no JSON
                      dados['name'] = novo_nome_json
                      dados['description'] = f"Assista {novo_nome_json}"
                      if nova_capa:
                          dados['thumbnailUrl'] = [nova_capa]
                          
                      novo_json = json.dumps(dados, ensure_ascii=False, indent=4)
                      novo_html = conteudo.replace(script_ld.string, novo_json)
                      novo_html = re.sub(r'<title>.*?</title>', f'<title>{novo_nome_json}</title>', novo_html)
                      novo_html = re.sub(r'<h1.*?>.*?</h1>', f'<h1 class="post-title">{novo_nome_json}</h1>', novo_html)
                      
                      if nova_capa:
                          novo_html = re.sub(r'poster="[^"]*"', f'poster="{nova_capa}"', novo_html)
                          novo_html = re.sub(r'<img src="[^"]*"', f'<img src="{nova_capa}"', novo_html)

                      # Renomeia o arquivo se o nome mudou
                      base_titulo = re.sub(r'\s*-\s*🍿Clau', '', novo_nome_json)
                      novo_slug = re.sub(r'[^a-z0-9]', '_', strip_accents(base_titulo).lower())
                      novo_slug = re.sub(r'_+', '_', novo_slug).strip('_')
                      
                      # Mantém o sufixo T1E1 se for série
                      match_ep = re.search(r'_t\d+e\d+', f.name, re.I)
                      if match_ep:
                          novo_nome = f"{novo_slug}{match_ep.group(0)}.html"
                      else:
                          novo_nome = f"{novo_slug}.html"

                      Path(novo_nome).write_text(novo_html, encoding="utf-8")
                      if f.name != novo_nome:
                          f.unlink()
                          
                      log(f"  [+] Salvo: {novo_nome}")
                      consertados += 1
                      time.sleep(0.1)
                      
                  except Exception as e:
                      log(f"  [x] Erro em {f.name}: {e}")

              log(f"Finalizado! Analisados: {processados} | Consertados: {consertados} | Deletados: {deletados}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/conserto_geral.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git reset .github/ 2>/dev/null || true
          
          if git diff --cached --quiet; then echo "Nada foi alterado nesta run."; exit 0; fi
          git commit -m "fix: conserto geral de nomes e capas"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando de forma segura..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "fix: retry conserto geral $i" || true
            sleep $((RANDOM % 10 + 5))
          done
