name: Consertar Nomes e Titulos Quebrados

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantos arquivos verificar por run'
        required: false
        default: '1000'
        type: string

permissions:
  contents: write

concurrency:
  group: consertar-nomes
  cancel-in-progress: false

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install beautifulsoup4

      - name: Verificar e consertar nomes
        env:
          LOTE_SIZE: ${{ inputs.lote || '1000' }}
        run: |
          cat > /tmp/consertar_nomes.py << 'PYEOF'
          import re, os, sys, json
          from pathlib import Path
          from bs4 import BeautifulSoup

          LOTE_SIZE = int(os.environ.get('LOTE_SIZE', 1000))

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def main():
              arquivos = list(Path(".").glob("https_www_*.html"))
              log(f"Analisando {len(arquivos)} arquivos com nomes quebrados...")
              
              processados = 0
              consertados = 0

              for f in arquivos:
                  if processados >= LOTE_SIZE:
                      log(f"Lote de {LOTE_SIZE} atingido. Parando por hoje.")
                      break

                  try:
                      # Exemplo de nome: https_www_vini7xgrave_site_2026_03_inix_escolha_de_sofia_1982_html.html
                      # O objetivo é extrair: escolha_de_sofia_1982
                      match = re.search(r'_site_\d{4}_\d{2}_(?:inix|arc|entre-nos|inix-entre-nos)[-_](.+?)_html\.html$', f.name, re.I)
                      
                      if not match:
                          continue
                          
                      processados += 1
                      slug_limpo = match.group(1).strip('_')
                      
                      # Constrói o nome limpo do arquivo
                      if slug_limpo.isdigit() or len(slug_limpo) < 3:
                          continue
                          
                      novo_nome = f"{slug_limpo}.html"
                      
                      # Extrai o título bonito (transforma underlines em espaços e capitaliza)
                      titulo_bonito = slug_limpo.replace('_', ' ').title()
                      # Tenta arrumar anos (ex: 1982)
                      nome_json = f"{titulo_bonito} - 🍿Clau"
                      
                      log(f"[{processados}/{LOTE_SIZE}] Consertando: {f.name} -> {novo_nome}")
                      
                      conteudo = f.read_text(encoding="utf-8")
                      soup = BeautifulSoup(conteudo, 'html.parser')
                      
                      script_ld = soup.find('script', type='application/ld+json')
                      if script_ld:
                          try:
                              dados = json.loads(script_ld.string)
                              dados['name'] = nome_json
                              
                              # Atualiza o @id e url para o domínio correto
                              base_url = "https://api-pobreflix-filmes.pages.dev"
                              file_url = f"{base_url}/{novo_nome}"
                              dados['@id'] = file_url
                              dados['url'] = file_url
                              
                              novo_json = json.dumps(dados, ensure_ascii=False, indent=4)
                              
                              # Substitui o JSON antigo pelo novo
                              novo_html = conteudo.replace(script_ld.string, novo_json)
                              novo_html = re.sub(r'<title>.*?</title>', f'<title>{nome_json}</title>', novo_html)
                              novo_html = re.sub(r'<h1>.*?</h1>', f'<h1>{nome_json}</h1>', novo_html)
                              
                              # Salva o arquivo com o novo nome e deleta o antigo
                              Path(novo_nome).write_text(novo_html, encoding="utf-8")
                              f.unlink()
                              
                              log(f"  [+] Salvo como: {novo_nome}")
                              consertados += 1
                          except Exception as e:
                              log(f"  [-] Erro no JSON: {e}")
                              
                  except Exception as e:
                      log(f"  [x] Erro ao processar {f.name}: {e}")

              log(f"Finalizado! Arquivos analisados: {processados} | Arquivos consertados: {consertados}")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/consertar_nomes.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git reset .github/ 2>/dev/null || true
          
          if git diff --cached --quiet; then echo "Nenhum nome precisou ser consertado nesta run."; exit 0; fi
          git commit -m "fix: consertar nomes e titulos quebrados nos arquivos antigos"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito detectado. Sincronizando de forma segura..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "fix: retry consertar nomes $i" || true
            sleep $((RANDOM % 10 + 5))
          done
