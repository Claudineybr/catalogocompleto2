name: Mega Extrair Series

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'URLs para visitar por run (lote)'
        required: false
        default: '100'
        type: string
      reprocessar_tudo:
        description: 'Reprocessar tudo (limpa cache/mapa/visitados)?'
        required: false
        default: false
        type: boolean
      auto_run:
        description: 'Ativar auto-chain (iniciar próxima run automaticamente)?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mega-series
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Limpar arquivos de controle (Opcional)
        if: ${{ inputs.reprocessar_tudo == true }}
        run: |
          echo "Limpando fila, feitas, pendentes e descartados..."
          rm -f series_fila.txt series_feitas.txt episodios_pendentes.json series_descartados.txt

      - name: Instalar Python e Playwright
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Extrair Series e Retentar Falhas
        env:
          LOTE_SIZE: ${{ inputs.lote || '100' }}
        run: |
          cat > /tmp/mega_series.py << 'PYEOF'
          import asyncio, re, json, requests, sys, unicodedata, os
          from bs4 import BeautifulSoup
          from pathlib import Path
          from playwright.async_api import async_playwright

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          ARQ_FILA        = Path("series_fila.txt")
          ARQ_FEITAS      = Path("series_feitas.txt")
          ARQ_PENDENTES   = Path("episodios_pendentes.json")
          ARQ_DESCARTADOS = Path("series_descartados.txt")

          SERIES_MORTAS = []
          MAX_TENTATIVAS = 6
          LOTE_SIZE = int(os.environ.get('LOTE_SIZE', 100))

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def construir_fila():
              log("Criando/atualizando fila de series...")
              urls, vistos = [], set()
              if ARQ_FILA.exists():
                  for u in ARQ_FILA.read_text(encoding="utf-8").splitlines():
                      u = u.strip()
                      if u and u not in vistos:
                          urls.append(u); vistos.add(u)
              start = 1
              while True:
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=15)
                      if r.status_code != 200: break
                      entries = r.json().get("feed", {}).get("entry", [])
                      if not entries: break
                      for e in entries:
                          link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                          if link:
                              u = link.split("?")[0].strip()
                              if u and u not in vistos:
                                  urls.append(u); vistos.add(u)
                      start += 150
                      if len(entries) < 150: break
                  except: break
              ARQ_FILA.write_text("\n".join(urls), encoding="utf-8")
              log(f"Fila: {len(urls)} URLs.")

          if not ARQ_FILA.exists():
              construir_fila()

          feitas = set()
          if ARQ_FEITAS.exists():
              feitas = set(l.strip() for l in ARQ_FEITAS.read_text(encoding="utf-8").splitlines() if l.strip())

          pendentes_dict = {}
          if ARQ_PENDENTES.exists():
              try:
                  for p in json.loads(ARQ_PENDENTES.read_text(encoding="utf-8")):
                      if any(m in p.get('url','').lower() for m in SERIES_MORTAS): continue
                      if p['arquivo'] not in pendentes_dict:
                          pendentes_dict[p['arquivo']] = p
                      else:
                          pendentes_dict[p['arquivo']]['tentativas'] = max(
                              pendentes_dict[p['arquivo']].get('tentativas',1),
                              p.get('tentativas',1))
              except: pass
          pendentes = list(pendentes_dict.values())

          todas = [u.strip() for u in ARQ_FILA.read_text(encoding="utf-8").splitlines() if u.strip()]
          fila = [u for u in todas if u not in feitas]
          lote = fila[:LOTE_SIZE]

          log(f"Total na fila: {len(todas)} | Ja feitos: {len(feitas)} | Faltam: {len(fila)} | Pendentes: {len(pendentes)} | Lote: {LOTE_SIZE}")

          def eh_serie(soup, url_pagina):
              # 1. JSON-LD
              for script in soup.find_all('script', type='application/ld+json'):
                  try:
                      dados = json.loads(script.string)
                      if isinstance(dados, list):
                          for d in dados:
                              if d.get('@type') in ['TVSeries','TVSeason','TVEpisode']: return True
                      elif isinstance(dados, dict):
                          if dados.get('@type') in ['TVSeries','TVSeason','TVEpisode']: return True
                  except: pass

              # 2. Links com padrões numéricos
              for a in soup.find_all('a', href=True):
                  href = a['href'].lower()
                  texto = a.get_text(strip=True).lower()
                  if re.search(r'epis[oó]dio[-_/]\d+', href, re.I): return True
                  if re.search(r'temporada[-_/]\d+', href, re.I): return True
                  if re.search(r'\bepis[oó]dio\s+\d+', texto, re.I): return True
                  if re.search(r'\btemporada\s+\d+', texto, re.I): return True

              # 3. Texto da página
              texto_pagina = soup.get_text(" ", strip=True).lower()
              if re.search(r'lista de epis[oó]dios', texto_pagina, re.I): return True
              if re.search(r'\b\d+\s*[ªº]\s*temporada', texto_pagina, re.I): return True
              if re.search(r'\bepis[oó]dio\s+\d+', texto_pagina, re.I): return True

              # 4. Título
              titulo = soup.title.string.lower() if soup.title else ""
              if re.search(r'\btemporada\b', titulo, re.I): return True
              if re.search(r'\bepis[oó]dio\b', titulo, re.I): return True
              if re.search(r'\bs[eé]rie\b', titulo, re.I): return True

              # 5. URL
              if re.search(r'/(?:temporada|season|episodio|episode)[/-]', url_pagina, re.I): return True

              return False

          def extrair_dados_pagina(html_text, url_pagina):
              soup = BeautifulSoup(html_text, 'html.parser')
              if not eh_serie(soup, url_pagina):
                  return None, None, "FILME"

              titulo = ""
              h1 = soup.find('h1', class_='post-title') or soup.find('h1')
              if h1: titulo = h1.text.strip()

              dados_ld = {}
              script_ld = soup.find('script', type='application/ld+json')
              if script_ld:
                  try:
                      dados_ld = json.loads(script_ld.string)
                      if not titulo and dados_ld.get('name'): titulo = dados_ld.get('name').strip()
                  except: pass

              if not titulo:
                  og = soup.find('meta', property='og:title')
                  if og and og.get('content'): titulo = og['content'].strip()
                  elif soup.title: titulo = soup.title.string.strip()

              titulo = unicodedata.normalize('NFKD', str(titulo))
              titulo = "".join([c for c in titulo if not unicodedata.combining(c)])
              titulo = re.sub(r'^.*?[-–—]\s*', '', titulo) if re.search(r'(vini|marcos|inix|grave)', titulo, re.I) else titulo
              titulo = titulo.replace('🍿Clau', '').strip(' -')
              titulo = re.sub(r'\.html?$', '', titulo, flags=re.I).strip()

              if not titulo or len(titulo) < 3 or titulo.isdigit() or "filmes e series" in titulo.lower() or re.match(r'^[a-z0-9\-]+$', titulo):
                  m = re.search(r'/([^/]+)\.html', url_pagina)
                  if m:
                      slug = m.group(1)
                      slug = re.sub(r'^(inix|arc|entre-nos|inix-entre-nos)[-_]', '', slug, flags=re.I)
                      slug = re.sub(r'[-_]\d{4}(_\d+)?$', '', slug)
                      titulo = slug.replace('-', ' ').title().strip()

              titulo = re.sub(r'\s*\(?\d{4}\)?\s*$', '', titulo).strip()
              titulo = re.sub(r'\s*-\s*(?:\d+\s*[ªº]\s*)?(?:temporada|season)\b.*$', '', titulo, flags=re.I).strip()

              capa = dados_ld.get('thumbnailUrl', [''])[0]
              if not capa or capa == 'h' or len(capa) < 5:
                  m = re.search(r'https://blogger\.googleusercontent\.com/img/[^"\'\s<>]+', html_text)
                  if m: capa = m.group(0)
              if not capa:
                  og_img = soup.find('meta', property='og:image')
                  capa = og_img['content'] if og_img and og_img.get('content') else "https://via.placeholder.com/500x750?text=Sem+Capa"

              return titulo.strip(), capa

          def extrair_video_da_pagina(html_text):
              soup = BeautifulSoup(html_text, 'html.parser')
              script_ld = soup.find('script', type='application/ld+json')
              if script_ld:
                  try:
                      dados_ld = json.loads(script_ld.string)
                      if dados_ld.get('contentUrl'): return dados_ld['contentUrl']
                  except: pass
              matches = re.findall(r'(https?://[^"\'\s<>]+(?:\.mp4|\.m3u8|tankie\.tube/videos/embed|oneplayer\.site)[^"\'\s<>]*)', html_text)
              if matches:
                  return matches[0]
              return None

          def extrair_capa(soup):
              og_img = soup.find('meta', property='og:image')
              if og_img and og_img.get('content'): return og_img['content']
              tw_img = soup.find('meta', attrs={'name': 'twitter:image'})
              if tw_img and tw_img.get('content'): return tw_img['content']
              return "https://via.placeholder.com/500x750?text=Sem+Capa"

          async def obter_link_episodio(context, url_ep):
              log(f"      [⏳] Buscando vídeo...")
              try:
                  r_ep = await asyncio.to_thread(requests.get, url_ep, headers=HEADERS, timeout=20)
                  link = extrair_video_da_pagina(r_ep.text)
                  if link:
                      log(f"      [⚡] Vídeo encontrado via Requests.")
                      return link
              except Exception: pass
              
              try:
                  log(f"      [🌐] Requests falhou. Abrindo Playwright...")
                  page = await context.new_page()
                  await page.goto(url_ep, wait_until="domcontentloaded", timeout=20000)
                  await asyncio.sleep(5)
                  html = await page.content()
                  link = extrair_video_da_pagina(html)
                  await page.close()
                  if link:
                      log(f"      [✅] Vídeo encontrado via Playwright.")
                      return link
                  else:
                      log(f"      [❌] Playwright não encontrou a tag <video>.")
              except Exception as e: 
                  log(f"      [❌] Erro no Playwright: {e}")
              return None

          def salvar_html(nome_arquivo, nome_json, link, capa_url):
              base_url = "https://api-pobreflix-filmes.pages.dev"
              file_url = f"{base_url}/{nome_arquivo}"

              dados = {
                  "@context": "https://schema.org",
                  "@type": "VideoObject",
                  "@id": file_url,
                  "url": file_url,
                  "name": nome_json,
                  "description": f"Assista {nome_json}",
                  "thumbnailUrl": [capa_url],
                  "uploadDate": "2020-01-01T00:00:00+00:00",
                  "inLanguage": "pt",
                  "contentUrl": link,
                  "embedUrl": link
              }
              js = json.dumps(dados, ensure_ascii=False, indent=4)

              html = (
                  f'<!DOCTYPE html>\n'
                  f'<html lang="pt-BR">\n'
                  f'<head>\n'
                  f'    <meta charset="UTF-8">\n'
                  f'    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
                  f'    <link rel="icon" href="data:,">\n'
                  f'    <script type="application/ld+json">\n'
                  f'{js}\n'
                  f'    </script>\n'
                  f'    <title>{nome_json}</title>\n'
                  f'    <style>\n'
                  f'        body, html {{ margin: 0; padding: 0; background-color: #000; height: 100%; width: 100%; overflow: hidden; }}\n'
                  f'        video {{ width: 100%; height: 100%; outline: none; }}\n'
                  f'    </style>\n'
                  f'</head>\n'
                  f'<body>\n'
                  f'    <video src="{link}" poster="{capa_url}" controls autoplay playsinline></video>\n'
                  f'</body>\n'
                  f'</html>'
              )
              Path(nome_arquivo).write_text(html, encoding='utf-8')

          async def processar_serie(context, url_serie):
              if any(m in url_serie.lower() for m in SERIES_MORTAS):
                  with open(ARQ_FEITAS,"a",encoding="utf-8") as f: f.write(url_serie.strip()+"\n")
                  return
              log(f"\n--> Verificando serie: {url_serie}")
              try:
                  r = await asyncio.to_thread(requests.get, url_serie, headers=HEADERS, timeout=20)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  html_final = r.text

                  if not eh_serie(soup, url_serie):
                      log("    (Não é série no HTML estático. Tentando com Playwright...)")
                      async with async_playwright() as pw:
                          browser = await pw.chromium.launch(headless=True)
                          page = await browser.new_page()
                          await page.goto(url_serie, wait_until="domcontentloaded", timeout=20000)
                          try:
                              # AQUI ESTÁ A MÁGICA: Espera até 10s pelo seletor
                              await page.wait_for_selector("text=Episódio, text=Temporada, text=Season", timeout=10000)
                          except: pass
                          await asyncio.sleep(5)
                          html_render = await page.content()
                          soup_render = BeautifulSoup(html_render, 'html.parser')
                          if not eh_serie(soup_render, url_serie):
                              log("    (É FILME. Pulando...)")
                              with open(ARQ_FEITAS,"a",encoding="utf-8") as f: f.write(url_serie.strip()+"\n")
                              await browser.close()
                              return
                          html_final = html_render
                          soup = soup_render
                          await browser.close()

                  titulo, capa_url = extrair_dados_pagina(html_final, url_serie)
                  slug = re.sub(r'[^a-z0-9]', '_', titulo.lower())
                  slug = re.sub(r'_html?$', '', slug)
                  slug = re.sub(r'_+', '_', slug).strip('_')

                  temporada, eps = 1, []
                  for tag in soup.find_all(['b', 'h2', 'h3', 'p', 'a', 'div']):
                      texto = tag.get_text(strip=True)
                      m_temp = re.search(r'(\d+)\s*[ªº]\s*Temporada', texto, re.I)
                      if m_temp:
                          temporada = int(m_temp.group(1)); continue
                      if tag.name == 'a' and 'episódio' in texto.lower():
                          href = tag.get('href')
                          if not href: continue
                          if href.startswith('/'): href = BASE_URL + href
                          m_ep = re.search(r'Episódio\s*(\d+)', texto, re.I)
                          num = m_ep.group(1) if m_ep else "0"
                          titulo_ep = re.sub(r'Episódio\s*\d+\s*-?\s*', '', texto, flags=re.I).strip()
                          eps.append({'temp': temporada, 'ep': num, 'titulo': titulo_ep, 'url': href})

                  with open(ARQ_FEITAS,"a",encoding="utf-8") as f: f.write(url_serie.strip()+"\n")
                  if not eps:
                      log("    (Nenhum episódio encontrado. Pulando...)"); return
                  log(f"    Série '{titulo}' ({slug}) - {len(eps)} episódios mapeados.")

                  for it in eps:
                      nome_arquivo = f"{slug}_t{it['temp']}e{it['ep']}.html"
                      
                      if Path(nome_arquivo).exists(): 
                          log(f"      (Já existe: {nome_arquivo})")
                          try:
                              conteudo = Path(nome_arquivo).read_text(encoding='utf-8')
                              if "via.placeholder.com" in conteudo or "Sem+Capa" in conteudo:
                                  if capa_url and "via.placeholder.com" not in capa_url:
                                      log(f"      [🔄] Capa ausente. Atualizando com a capa do site...")
                                      conteudo = re.sub(r'poster="[^"]*"', f'poster="{capa_url}"', conteudo)
                                      conteudo = re.sub(r'"thumbnailUrl":\s*\[[^\]]*\]', f'"thumbnailUrl": ["{capa_url}"]', conteudo, flags=re.DOTALL)
                                      Path(nome_arquivo).write_text(conteudo, encoding='utf-8')
                                      log(f"      [+] Capa atualizada!")
                          except Exception as e:
                              log(f"      [-] Erro ao atualizar capa: {e}")
                          continue
                      
                      nome_json = f"{titulo} - T{it['temp']}E{it['ep']} - {it['titulo']} - 🍿Clau"
                      log(f"    -> Processando T{it['temp']}E{it['ep']} - {it['titulo']}")
                      
                      link = await obter_link_episodio(context, it['url'])

                      if not link:
                          log(f"      [-] Falhou ao obter link. Jogando para pendentes.")
                          if not any(p['arquivo']==nome_arquivo for p in pendentes):
                              pendentes.append({"arquivo": nome_arquivo, "nome_json": nome_json, "url": it['url'], "tentativas": 1})
                          continue
                      salvar_html(nome_arquivo, nome_json, link, capa_url)
                      log(f"      [+] Salvo: {nome_arquivo}")
              except Exception as e:
                  log(f"    Erro na serie {url_serie}: {e}")

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  for i, url in enumerate(lote, 1):
                      log(f"[{i}/{len(lote)}]")
                      await processar_serie(ctx, url)

                  if pendentes:
                      log(f"\n=== RETENTANDO {len(pendentes)} EPISODIOS ===")
                      ainda = []
                      for item in pendentes:
                          if Path(item['arquivo']).exists(): continue
                          if any(m in item.get('url','').lower() for m in SERIES_MORTAS): continue
                          if item.get("tentativas",0) >= MAX_TENTATIVAS:
                              with open(ARQ_DESCARTADOS,"a",encoding="utf-8") as f:
                                  f.write(f"{item['arquivo']}\t{item['url']}\t{item.get('tentativas')} falhas\n")
                              continue
                          log(f"--> Tentativa {item['tentativas']+1}/{MAX_TENTATIVAS}: {item['arquivo']}")
                          
                          link = await obter_link_episodio(ctx, item['url'])
                          
                          capa_url = "https://via.placeholder.com/500x750?text=Sem+Capa"
                          try:
                              r_ep = await asyncio.to_thread(requests.get, item['url'], headers=HEADERS, timeout=20)
                              soup = BeautifulSoup(r_ep.text, 'html.parser')
                              capa_url = extrair_capa(soup)
                          except Exception: pass

                          if link:
                              salvar_html(item['arquivo'], item['nome_json'], link, capa_url)
                              log("    [+] SUCESSO")
                          else:
                              item["tentativas"] = item.get("tentativas",1) + 1
                              ainda.append(item)
                      pendentes.clear(); pendentes.extend(ainda)
                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
              ARQ_PENDENTES.write_text(json.dumps(pendentes, ensure_ascii=False, indent=2), encoding="utf-8")
          PYEOF
          python3 /tmp/mega_series.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "chore: atualizar catalogo de series (lote ${{ inputs.lote || '100' }})"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git reset --mixed origin/main
            git add -A
            git commit -m "chore: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done

      - name: Disparar próxima run (se fila não vazia)
        if: success() && (github.event_name == 'schedule' || inputs.auto_run == true)
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          TOTAL=$(wc -l < series_fila.txt)
          FEITOS=$(sort -u series_feitas.txt | wc -l)
          FALTAM=$((TOTAL - FEITOS))
          echo "Total na fila: $TOTAL | Ja feitos: $FEITOS | Faltam: $FALTAM"
          if [ "$FALTAM" -le 0 ]; then
            echo "✅ Fila vazia. Chain encerrada."; exit 0
          fi
          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="series.yml" --limit 100 --json event,createdAt --jq "[.[] | select(.event == \"workflow_dispatch\")] | length" --repo "$REPO" 2>/dev/null || echo 0)
          if [ "$RECENTES" -ge 30 ]; then
            echo "⚠️ Limite de 30 runs/hora atingido. Aguardando cron."; exit 0
          fi
          echo "⏳ Aguardando 30 segundos antes de disparar a próxima run..."
          sleep 30
          echo "🔁 Disparando próxima run..."
          gh workflow run "series.yml" --repo "$REPO" --ref main
