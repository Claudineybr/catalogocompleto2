name: Mega Extrair Series (Lotes de 100)

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mega-series
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar Python e Playwright
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Extrair Series e Retentar Falhas
        run: |
          cat > /tmp/mega_series.py << 'PYEOF'
          import asyncio, re, json, requests, sys, unicodedata
          from bs4 import BeautifulSoup
          from pathlib import Path
          from playwright.async_api import async_playwright

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          ARQ_FILA        = Path("series_fila.txt")
          ARQ_FEITAS      = Path("series_feitas.txt")
          ARQ_PENDENTES   = Path("episodios_pendentes.json")
          ARQ_DESCARTADOS = Path("series_descartados.txt")

          SERIES_MORTAS = []
          MAX_TENTATIVAS = 6

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def construir_fila():
              log("Criando/atualizando fila de series...")
              urls, vistos = [], set()
              if ARQ_FILA.exists():
                  for u in ARQ_FILA.read_text(encoding="utf-8").splitlines():
                      u = u.strip()
                      if u and u not in vistos:
                          urls.append(u); vistos.add(u)
              start = 1
              while True:
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=15)
                      if r.status_code != 200: break
                      entries = r.json().get("feed", {}).get("entry", [])
                      if not entries: break
                      for e in entries:
                          link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                          if link:
                              u = link.split("?")[0].strip()
                              if u and u not in vistos:
                                  urls.append(u); vistos.add(u)
                      start += 150
                      if len(entries) < 150: break
                  except: break
              ARQ_FILA.write_text("\n".join(urls), encoding="utf-8")
              log(f"Fila: {len(urls)} URLs.")

          if not ARQ_FILA.exists():
              construir_fila()

          feitas = set()
          if ARQ_FEITAS.exists():
              feitas = set(l.strip() for l in ARQ_FEITAS.read_text(encoding="utf-8").splitlines() if l.strip())

          pendentes_dict = {}
          if ARQ_PENDENTES.exists():
              try:
                  for p in json.loads(ARQ_PENDENTES.read_text(encoding="utf-8")):
                      if any(m in p.get('url','').lower() for m in SERIES_MORTAS): continue
                      if p['arquivo'] not in pendentes_dict:
                          pendentes_dict[p['arquivo']] = p
                      else:
                          pendentes_dict[p['arquivo']]['tentativas'] = max(
                              pendentes_dict[p['arquivo']].get('tentativas',1),
                              p.get('tentativas',1))
              except: pass
          pendentes = list(pendentes_dict.values())

          todas = [u.strip() for u in ARQ_FILA.read_text(encoding="utf-8").splitlines() if u.strip()]
          fila = [u for u in todas if u not in feitas]
          
          lote = fila[:100]

          log(f"Total na fila: {len(todas)} | Ja feitos: {len(feitas)} | Faltam: {len(fila)} | Pendentes: {len(pendentes)}.")

          def extrair_dados_pagina(html_text):
              soup = BeautifulSoup(html_text, 'html.parser')
              
              # 1. JSON-LD
              dados_ld = {}
              script_ld = soup.find('script', type='application/ld+json')
              if script_ld:
                  try: dados_ld = json.loads(script_ld.string)
                  except: pass

              # 2. Título (Prioriza o JSON-LD, depois a tag <title>)
              titulo = dados_ld.get('name')
              if not titulo or len(titulo) < 3:
                  raw = soup.title.string if soup.title else "Serie Desconhecida"
                  raw_norm = unicodedata.normalize('NFKD', str(raw))
                  raw_norm = "".join([c for c in raw_norm if not unicodedata.combining(c)])
                  partes = [p.strip() for p in re.split(r'\s+[-–—]\s+', raw_norm) if p.strip()]
                  titulo = partes[-1] if len(partes) > 1 else partes[0]
                  
              # Remove o ano
              titulo = re.sub(r'\s*\(?\d{4}\)?\s*$', '', titulo).strip()
              titulo = re.sub(r'\s*-\s*(?:\d+\s*[ªº]\s*)?(?:temporada|season)\b.*$', '', titulo, flags=re.I).strip()

              # 3. Capa (JSON-LD, se "h" vai pro HTML)
              capa = dados_ld.get('thumbnailUrl', [''])[0]
              if not capa or capa == 'h' or len(capa) < 5:
                  m = re.search(r'https://blogger\.googleusercontent\.com/img/[^"\'\s<>]+', html_text)
                  if m: capa = m.group(0)
                  
              if not capa:
                  og_img = soup.find('meta', property='og:image')
                  capa = og_img['content'] if og_img and og_img.get('content') else "https://via.placeholder.com/500x750?text=Sem+Capa"

              return titulo.strip(), capa

          def extrair_video_da_pagina(html_text):
              soup = BeautifulSoup(html_text, 'html.parser')
              script_ld = soup.find('script', type='application/ld+json')
              if script_ld:
                  try:
                      dados_ld = json.loads(script_ld.string)
                      if dados_ld.get('contentUrl'): return dados_ld['contentUrl']
                  except: pass
                  
              matches = re.findall(r'(https?://[^"\'\s<>]+(?:\.mp4|\.m3u8|tankie\.tube/videos/embed|oneplayer\.site)[^"\'\s<>]*)', html_text)
              if matches:
                  return matches[0]
              return None

          def salvar_html(nome_arquivo, nome_json, link, capa_url):
              uid = re.sub(r'[^a-zA-Z0-9]', '', nome_arquivo.replace('.html', ''))
              
              dados = {
                  "@context": "https://schema.org",
                  "@type": "VideoObject",
                  "supportPlatform": ["https://schema.org/IOSPlatform", "https://schema.org/AndroidPlatform"],
                  "name": nome_json,
                  "description": f"Assista {nome_json}",
                  "thumbnailUrl": [capa_url],
                  "uploadDate": "2024-11-04T23:00:00+00:00",
                  "duration": "PT00H45M00S",
                  "contentUrl": link,
                  "interactionStatistic": {
                      "@type": "InteractionCounter",
                      "interactionType": { "@type": "WatchAction" },
                      "userInteractionCount": 9458
                  }
              }
              js = json.dumps(dados, ensure_ascii=False, indent=2)
              
              html = (
                  f'<!DOCTYPE html>\n'
                  f'<html lang="pt-BR">\n'
                  f'<head>\n'
                  f'<meta charset="UTF-8">\n'
                  f'<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
                  f'<script type="application/ld+json">\n'
                  f'{js}\n'
                  f'</script>\n'
                  f'<title>{nome_json}</title>\n'
                  f'</head>\n'
                  f'<body style="background-color: #0b0b12; color: #fff; font-family: sans-serif;">\n'
                  f'<h1 class="post-title" style="margin-bottom: 20px; color: #fff;">{nome_json}</h1>\n'
                  f'<div class="meu-card-player" style="background: linear-gradient(145deg,#0b0b12,#161625); border-radius:20px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.8); margin:25px 0; border:1px solid rgba(255,255,255,.06);">\n'
                  f'  <div class="capa-filme" id="capa-{uid}" style="cursor: pointer; position: relative;">\n'
                  f'    <img src="{capa_url}" style="width:100%; display:block;">\n'
                  f'    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:70px; height:70px; background:linear-gradient(135deg,#7a00ff,#c000ff); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(120,0,255,.6); color:white; font-size:26px; border:2px solid rgba(255,255,255,.2);">\n'
                  f'      ▶\n'
                  f'    </div>\n'
                  f'    <div style="position:absolute; top:12px; right:12px; background:#ff003c; padding:6px 12px; border-radius:20px; font-size:11px; color:#fff; font-weight:bold;">\n'
                  f'      HD\n'
                  f'    </div>\n'
                  f'  </div>\n'
                  f'  <div id="container-video-{uid}" style="display: none;">\n'
                  f'    <video \n'
                  f'      id="player-video-{uid}"\n'
                  f'      title="{nome_json}"\n'
                  f'      controls \n'
                  f'      playsinline \n'
                  f'      poster="{capa_url}" \n'
                  f'      style="width: 100%; display: block; background: #000;">\n'
                  f'      Seu navegador não suporta vídeo HTML5.\n'
                  f'    </video>\n'
                  f'    <div id="video-src-{uid}" data-src="{link}" style="display:none;"></div>\n'
                  f'  </div>\n'
                  f'  <div class="conteudo-card" style="padding: 18px;">\n'
                  f'    <p style="font-size: 14px; color: #cfcfcf; line-height: 1.6; margin-bottom: 14px;">\n'
                  f'      Assista {nome_json} online em HD.\n'
                  f'    </p>\n'
                  f'  </div>\n'
                  f'</div>\n'
                  f'<script>\n'
                  f'  document.addEventListener("DOMContentLoaded", function() {{\n'
                  f'    const capa = document.getElementById(\'capa-{uid}\');\n'
                  f'    const containerVideo = document.getElementById(\'container-video-{uid}\');\n'
                  f'    const video = document.getElementById(\'player-video-{uid}\');\n'
                  f'    const srcData = document.getElementById(\'video-src-{uid}\');\n'
                  f'    capa.addEventListener(\'click\', function() {{\n'
                  f'      capa.style.display = \'none\';\n'
                  f'      containerVideo.style.display = \'block\';\n'
                  f'      if (!video.src) {{\n'
                  f'          video.src = srcData.getAttribute(\'data-src\');\n'
                  f'          video.load();\n'
                  f'      }}\n'
                  f'      video.play().catch(function(error) {{\n'
                  f'        console.log("Autoplay bloqueado.");\n'
                  f'      }});\n'
                  f'    }});\n'
                  f'  }});\n'
                  f'</script>\n'
                  f'</body>\n'
                  f'</html>'
              )
              Path(nome_arquivo).write_text(html, encoding='utf-8')

          async def processar_serie(context, url_serie):
              if any(m in url_serie.lower() for m in SERIES_MORTAS):
                  with open(ARQ_FEITAS,"a",encoding="utf-8") as f: f.write(url_serie.strip()+"\n")
                  return
              log(f"\n--> Verificando serie: {url_serie}")
              try:
                  r = await asyncio.to_thread(requests.get, url_serie, headers=HEADERS, timeout=20)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  
                  titulo, capa_url = extrair_dados_pagina(r.text)
                  slug = re.sub(r'[^a-z0-9]', '_', titulo.lower())
                  slug = re.sub(r'_+', '_', slug).strip('_')

                  temporada, eps = 1, []
                  for tag in soup.find_all(['b', 'h2', 'h3', 'p', 'a', 'div']):
                      texto = tag.get_text(strip=True)
                      m_temp = re.search(r'(\d+)\s*[ªº]\s*Temporada', texto, re.I)
                      if m_temp:
                          temporada = int(m_temp.group(1)); continue
                      if tag.name == 'a' and 'episódio' in texto.lower():
                          href = tag.get('href')
                          if not href: continue
                          if href.startswith('/'): href = BASE_URL + href
                          m_ep = re.search(r'Episódio\s*(\d+)', texto, re.I)
                          num = m_ep.group(1) if m_ep else "0"
                          titulo_ep = re.sub(r'Episódio\s*\d+\s*-?\s*', '', texto, flags=re.I).strip()
                          eps.append({'temp': temporada, 'ep': num, 'titulo': titulo_ep, 'url': href})

                  with open(ARQ_FEITAS,"a",encoding="utf-8") as f: f.write(url_serie.strip()+"\n")
                  if not eps:
                      log("    (E filme. Pulando...)"); return
                  log(f"    Serie '{titulo}' ({slug}) - {len(eps)} episodios.")

                  for it in eps:
                      nome_arquivo = f"{slug}_t{it['temp']}e{it['ep']}.html"
                      if Path(nome_arquivo).exists(): continue
                      nome_json = f"{titulo} - T{it['temp']}E{it['ep']} - {it['titulo']} - 🍿Clau"
                      
                      # Tenta pegar o link do vídeo do episódio
                      r_ep = await asyncio.to_thread(requests.get, it['url'], headers=HEADERS, timeout=20)
                      link = extrair_video_da_pagina(r_ep.text)
                      
                      if not link:
                          if not any(p['arquivo']==nome_arquivo for p in pendentes):
                              pendentes.append({"arquivo": nome_arquivo, "nome_json": nome_json, "url": it['url'], "tentativas": 1})
                          continue
                      salvar_html(nome_arquivo, nome_json, link, capa_url)
                      log(f"      [+] Salvo: {nome_arquivo}")
              except Exception as e:
                  log(f"    Erro na serie {url_serie}: {e}")

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  for i, url in enumerate(lote, 1):
                      log(f"[{i}/{len(lote)}]")
                      await processar_serie(ctx, url)

                  if pendentes:
                      log(f"\n=== RETENTANDO {len(pendentes)} EPISODIOS ===")
                      ainda = []
                      for item in pendentes:
                          if Path(item['arquivo']).exists(): continue
                          if any(m in item.get('url','').lower() for m in SERIES_MORTAS): continue
                          if item.get("tentativas",0) >= MAX_TENTATIVAS:
                              with open(ARQ_DESCARTADOS,"a",encoding="utf-8") as f:
                                  f.write(f"{item['arquivo']}\t{item['url']}\t{item.get('tentativas')} falhas\n")
                              continue
                          log(f"--> Tentativa {item['tentativas']+1}/{MAX_TENTATIVAS}: {item['arquivo']}")
                          link = await extrair_video_playwright(ctx, item['url'])
                          
                          capa_url = "https://via.placeholder.com/500x750?text=Sem+Capa"
                          try:
                              r = await asyncio.to_thread(requests.get, item['url'], headers=HEADERS, timeout=20)
                              soup = BeautifulSoup(r.text, 'html.parser')
                              capa_url = extrair_capa(soup)
                          except: pass

                          if link:
                              salvar_html(item['arquivo'], item['nome_json'], link, capa_url)
                              log("    [+] SUCESSO")
                          else:
                              item["tentativas"] = item.get("tentativas",1) + 1
                              ainda.append(item)
                      pendentes.clear(); pendentes.extend(ainda)
                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
              ARQ_PENDENTES.write_text(json.dumps(pendentes, ensure_ascii=False, indent=2), encoding="utf-8")
          PYEOF
          python3 /tmp/mega_series.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f series_feitas.txt series_fila.txt episodios_pendentes.json series_descartados.txt 2>/dev/null || true
          git add -f *.html *.json *.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "chore: atualizar catalogo de series (player HTML5)"

          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git reset --mixed origin/main
            git add -f series_feitas.txt series_fila.txt episodios_pendentes.json series_descartados.txt 2>/dev/null || true
            git add -f *.html *.json *.txt 2>/dev/null || true
            git commit -m "chore: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done

      - name: Disparar próxima run (se fila não vazia)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          TOTAL=$(wc -l < series_fila.txt)
          FEITOS=$(sort -u series_feitas.txt | wc -l)
          FALTAM=$((TOTAL - FEITOS))
          
          echo "Total na fila: $TOTAL | Ja feitos: $FEITOS | Faltam: $FALTAM"
          
          if [ "$FALTAM" -le 0 ]; then
            echo "✅ Fila vazia. Chain encerrada."; exit 0
          fi

          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="series.yml" --limit 100 --json event,createdAt --jq "[.[] | select(.event == \"workflow_dispatch\") | select(.createdAt > \"$LIMITE_ISO\")] | length" --repo "$REPO" 2>/dev/null || echo 0)
          
          if [ "$RECENTES" -ge 30 ]; then
            echo "⚠️ Limite de 30 runs/hora atingido. Aguardando cron."; exit 0
          fi

          echo "⏳ Aguardando 30 segundos antes de disparar a próxima run..."
          sleep 30

          echo "🔁 Disparando próxima run..."
          gh workflow run "series.yml" --repo "$REPO" --ref main
