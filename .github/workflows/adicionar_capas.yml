name: Adicionar Capas (Name + IMDb Fallback)

on:
  workflow_dispatch: # Roda na mão

permissions:
  contents: write

concurrency:
  group: adicionar-capas-name
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: pip install beautifulsoup4 requests

      - name: Buscar Capas no TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > buscar_capas.py << 'PYEOF'
          import os
          import re
          import json
          import requests
          import time
          import sys
          import unicodedata
          from bs4 import BeautifulSoup
          from pathlib import Path
          import urllib.parse

          TMDB_API_KEY = os.environ.get("TMDB_API_KEY")
          if not TMDB_API_KEY:
              print("ERRO: TMDB_API_KEY nao configurada.")
              sys.exit(1)

          ARQ_PROCESSADOS = Path("capas_processadas.txt")
          ARQ_SEM_CAPA = Path("filmes_sem_capa.txt") # <-- NOVO ARQUIVO AQUI

          processados = set()
          if ARQ_PROCESSADOS.exists():
              processados = set(line.strip() for line in ARQ_PROCESSADOS.read_text(encoding="utf-8").splitlines() if line.strip())

          arquivos = list(Path(".").glob("*.json"))
          faltam = [f for f in arquivos if f.name not in processados]
          lote = faltam[:1000]
          
          print(f"Total de JSONs: {len(arquivos)} | Ja processados: {len(processados)} | Restantes: {len(faltam)}")

          def buscar_tmdb_por_imdb(imdb_id):
              url = f"https://api.themoviedb.org/3/find/{imdb_id}?api_key={TMDB_API_KEY}&language=pt-BR&external_source=imdb_id"
              try:
                  r = requests.get(url, timeout=10)
                  if r.status_code == 200:
                      data = r.json()
                      for tipo in ["movie_results", "tv_results"]:
                          if data.get(tipo):
                              poster = data[tipo][0].get("poster_path")
                              if poster: return f"https://image.tmdb.org/t/p/w500{poster}"
              except: pass
              return None

          def buscar_tmdb_por_nome(titulo, ano, is_series):
              if not titulo or len(titulo) < 2: return None
              tipo = "tv" if is_series else "movie"
              
              if ano:
                  year_param = f"&first_air_date_year={ano}" if is_series else f"&year={ano}"
                  url = f"https://api.themoviedb.org/3/search/{tipo}?api_key={TMDB_API_KEY}&language=pt-BR&query={urllib.parse.quote(titulo)}{year_param}"
                  try:
                      r = requests.get(url, timeout=10)
                      if r.status_code == 200 and r.json().get("results"):
                          poster = r.json()["results"][0].get("poster_path")
                          if poster: return f"https://image.tmdb.org/t/p/w500{poster}"
                  except: pass
                  time.sleep(0.1)

              url_sem_ano = f"https://api.themoviedb.org/3/search/{tipo}?api_key={TMDB_API_KEY}&language=pt-BR&query={urllib.parse.quote(titulo)}"
              try:
                  r = requests.get(url_sem_ano, timeout=10)
                  if r.status_code == 200 and r.json().get("results"):
                      poster = r.json()["results"][0].get("poster_path")
                      if poster: return f"https://image.tmdb.org/t/p/w500{poster}"
              except: pass

              return None

          def limpar_nome(nome_json):
              nome = nome_json
              lixos = ['🕸️ PK', '🍿Clau', '𝑴arcø𝒔x⁷👾', '𝑴arcø𝒔ˣ⁷👾', '𝑽iNi𝟕x👾', 'Marcos', 'LEGENDADO', 'DUBLADO', 'HD']
              for lixo in lixos:
                  nome = nome.replace(lixo, '')
              
              partes = [p.strip() for p in re.split(r'\s+-\s+|\s+–\s+', nome) if p.strip()]
              if partes:
                  nome = max(partes, key=len)
                  
              nome = unicodedata.normalize('NFKD', nome).encode('ASCII', 'ignore').decode('ASCII')
              
              match_ano = re.search(r'\b(19\d{2}|20\d{2})\b', nome_json)
              ano = match_ano.group(1) if match_ano else ""
              
              titulo = re.sub(r'\b(19\d{2}|20\d{2})\b', '', nome)
              titulo = re.sub(r'[\(\)\[\]]', '', titulo)
              titulo = re.sub(r'\s+', ' ', titulo).strip()
              
              return titulo, ano

          contador = 0
          for arquivo in lote:
              try:
                  conteudo = arquivo.read_text(encoding="utf-8")
                  
                  if "image.tmdb.org" in conteudo:
                      with open(ARQ_PROCESSADOS, "a", encoding="utf-8") as f:
                          f.write(arquivo.name + "\n")
                      continue

                  soup = BeautifulSoup(conteudo, "html.parser")
                  script_tag = soup.find("script", type="application/ld+json")
                  if not script_tag: continue
                  
                  dados = json.loads(script_tag.string)
                  nome_json = dados.get("name", "")
                  url_video = dados.get("contentUrl", "")
                  
                  if not nome_json: continue
                  is_series = bool(re.search(r'_t\d+e\d+', arquivo.name, re.I))
                  
                  titulo_busca, ano_busca = limpar_nome(nome_json)
                  
                  if not titulo_busca or "desconhecido" in titulo_busca.lower(): continue

                  print(f"Buscando: '{titulo_busca}' ({ano_busca}) [{'Serie' if is_series else 'Filme'}]...", end=" ")
                  
                  # 1. Tenta buscar pelo Nome
                  capa_url = buscar_tmdb_por_nome(titulo_busca, ano_busca, is_series)
                  
                  # 2. Se falhar, tenta buscar pelo ID do IMDb
                  if not capa_url:
                      match_imdb = re.search(r'(tt\d{7,9})', url_video)
                      if match_imdb:
                          print("(Tentando IMDb)...", end=" ")
                          capa_url = buscar_tmdb_por_imdb(match_imdb.group(1))
                  
                  if capa_url:
                      print("ACHEI!")
                      dados["thumbnailUrl"] = [capa_url]
                      novo_json_str = json.dumps(dados, ensure_ascii=False, indent=2)
                      
                      novo_html = conteudo.replace(script_tag.string, novo_json_str)
                      arquivo.write_text(novo_html, encoding="utf-8")
                      contador += 1
                  else:
                      print("NAO ACHOU")
                      # REGISTRA O ERRO NO TXT DE FALHAS
                      with open(ARQ_SEM_CAPA, "a", encoding="utf-8") as f_erro:
                          f_erro.write(f"{arquivo.name} | Buscado: '{titulo_busca}' ({ano_busca})\n")
                  
                  with open(ARQ_PROCESSADOS, "a", encoding="utf-8") as f:
                      f.write(arquivo.name + "\n")

                  time.sleep(0.2)
              except Exception as e:
                  pass

          print(f"\nFinalizado! {contador} capas adicionadas.")
          if ARQ_SEM_CAPA.exists():
              print(f"Arquivos sem capa salvos em '{ARQ_SEM_CAPA.name}' para analise manual.")
          PYEOF

          python3 buscar_capas.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -f capas_processadas.txt 2>/dev/null || true
          git add -f filmes_sem_capa.txt 2>/dev/null || true # <-- SALVA O ARQUIVO DE FALHAS
          git add *.json
          git add *.txt
          
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          
          git commit -m "feat: adicionar capas e registrar falhas em filmes_sem_capa.txt"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then
              echo "[SUCESSO] Push OK"
              exit 0
            fi
            git pull --rebase origin main --autostash || git pull origin main --no-rebase -X ours --no-edit
            sleep 3
          done

      - name: Disparar proxima run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          TOTAL=$(ls -1 *.json 2>/dev/null | wc -l)
          PROCESSADOS=$(sort -u capas_processadas.txt 2>/dev/null | wc -l)
          FALTAM=$((TOTAL - PROCESSADOS))
          
          if [ "$FALTAM" -le 0 ]; then
            echo "✅ Todas as capas processadas."; exit 0
          fi

          sleep 30
          gh workflow run "capas_por_name.yml" --repo "$REPO" --ref main || true
