name: Teste RedeCanais v11 (Bypass Cloudflare)

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar deps
        run: |
          pip install playwright playwright-stealth curl_cffi beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Extrair Link (Stealth + Curl_CFFI)
        run: |
          cat > /tmp/teste_v11.py << 'PYEOF'
          import asyncio, re, sys
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          from playwright_stealth import stealth_async
          from curl_cffi import requests as curl_requests

          URL_PLAYER = "https://redecanais.by/player3/server.php?categoria=vod&server=RCServer07&subfolder=ondemand&vid=ARROWT01EP01&gid=0B265dpk7MD54RUh3UVZKWTBUYlk"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def tentar_curl_cffi():
              log("\n--- Estrategia 1: curl_cffi (Disfarce de Chrome) ---")
              try:
                  # impersonate="chrome120" faz o curl se passar pelo Chrome real
                  r = curl_requests.get(URL_PLAYER, headers=HEADERS, impersonate="chrome120", timeout=20)
                  log(f"[*] Status Code: {r.status_code}")
                  
                  if r.status_code == 200:
                      # Procura o link do redirect.api ou arquivos .mp4
                      match_redirect = re.search(r'(/player3/redirect\.api\?r=[^"\']+)', r.text)
                      if match_redirect:
                          log(f"[+] Link redirect.api encontrado no HTML: https://redecanais.by{match_redirect.group(1)}")
                          return f"https://redecanais.by{match_redirect.group(1)}"
                          
                      match_mp4 = re.search(r'(https?://[^"\']+\.(?:mp4|m3u8))', r.text, re.I)
                      if match_mp4:
                          log(f"[+] Link direto encontrado no HTML: {match_mp4.group(1)}")
                          return match_mp4.group(1)
                          
                      log("[-] HTML retornado, mas nenhum link de download/vídeo foi achado.")
                      # Salva uma amostra do HTML para debug
                      open("/tmp/player_debug.html", "w").write(r.text)
                      log("[*] HTML do player salvo em /tmp/player_debug.html para análise.")
                  else:
                      log(f"[-] Cloudflare bloqueou (Status {r.status_code}).")
              except Exception as e:
                  log(f"[-] Erro: {e}")
              return None

          async def tentar_playwright_stealth():
              log("\n--- Estrategia 2: Playwright + Stealth (Enganando o Cloudflare) ---")
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  page = await ctx.new_page()
                  
                  # Aplica o stealth para esconder que é um robô
                  await stealth_async(page)

                  capturados = []
                  page.on("request", lambda r: capturados.append(r.url) if re.search(r'(mp4|m3u8|redirect\.api)', r.url, re.I) else None)

                  try:
                      log("[*] Navegando para o player com Stealth...")
                      await page.goto(URL_PLAYER, wait_until="domcontentloaded", timeout=30000)
                      
                      # Espera o Cloudflare Turnstile processar (pode levar até 10s)
                      log("[*] Esperando Cloudflare Turnstile (10 segundos)...")
                      await asyncio.sleep(10)

                      # Se o Cloudflare passou, a página do player deve carregar os botões
                      html = await page.content()
                      
                      # Tenta achar o link do redirect.api ou embed
                      match = re.search(r'(/player3/redirect\.api\?r=[^"\']+)', html)
                      if match:
                          link = f"https://redecanais.by{match.group(1)}"
                          log(f"[+] SUCESSO! Link de Download encontrado: {link}")
                          await browser.close()
                          return link
                          
                      # Tenta clicar no botão de Embed, se existir
                      try:
                          log("[*] Tentando clicar em botões de play/embed...")
                          await page.mouse.click(400, 300) # clique no centro do player
                          await asyncio.sleep(5)
                      except: pass

                      if capturados:
                          log(f"[+] Capturado na rede após Stealth: {capturados[0]}")
                          await browser.close()
                          return capturados[0]
                          
                      log("[-] Stealth não conseguiu capturar o link. O Cloudflare pode ter bloqueado.")
                      # Tira um print da tela para vermos se passou do Cloudflare
                      await page.screenshot(path="/tmp/screenshot_player.png")
                      log("[*] Print da tela salvo em /tmp/screenshot_player.png")
                      
                  except Exception as e:
                      log(f"[-] Erro no Stealth: {e}")
                  finally:
                      await browser.close()
              return None

          def main():
              # Tenta o curl_cffi primeiro (mais rápido)
              link = tentar_curl_cffi()
              if link:
                  log(f"\n=== RESULTADO FINAL: {link} ===")
                  return

              # Se falhar, tenta o Playwright com Stealth
              link = asyncio.run(tentar_playwright_stealth())
              if link:
                  log(f"\n=== RESULTADO FINAL: {link} ===")
                  return

              log("\n=== FALHA TOTAL: Cloudflare bloqueou ambas as tentativas ===")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/teste_v11.py
