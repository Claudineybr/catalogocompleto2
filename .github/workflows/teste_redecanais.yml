name: Teste RedeCanais v7 (Biblioteca + Numpy)

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependências
        run: |
          # Adicionado o numpy que faltava
          pip install redecanais numpy

      - name: Extrair link com a biblioteca redecanais
        run: |
          cat > /tmp/teste_redecanais_lib.py << 'PYEOF'
          import sys
          from redecanais.redecanais import ChannelsNetwork

          URL_ALVO = "https://redecanais.by/arrow-1a-temporada-episodio-01-piloto_530488a01.html"

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def main():
              log(f"[+] Iniciando extração para: {URL_ALVO}")
              try:
                  cn = ChannelsNetwork()
                  log("[*] Chamando find_streams()... (isso pode demorar alguns segundos)")
                  resultado = cn.find_streams(URL_ALVO)
                  
                  if resultado:
                      log(f"\n[+] RESULTADO RETORNADO PELA BIBLIOTECA:")
                      log(f"{resultado}")
                  else:
                      log("\n[-] A biblioteca retornou um resultado vazio (None).")
              except Exception as e:
                  log(f"\n[-] Erro ao usar a biblioteca: {e}")
                  import traceback
                  traceback.print_exc()

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/teste_redecanais_lib.py
