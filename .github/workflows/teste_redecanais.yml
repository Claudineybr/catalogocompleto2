name: Teste RedeCanais v4 (Regex HTML)

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar deps
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Extrair Link (Regex + Playwright)
        run: |
          cat > /tmp/teste_v4.py << 'PYEOF'
          import asyncio, re, sys
          from playwright.async_api import async_playwright

          URL_ALVO = "https://redecanais.by/arrow-1a-temporada-episodio-01-piloto_530488a01.html"
          BASE_URL = "https://redecanais.by"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          async def extrair_do_html(html):
              # Padrão clássico do player: file: "http://....mp4"
              m = re.search(r'file\s*:\s*["\'](https?://[^"\']+\.(?:mp4|m3u8))["\']', html, re.I)
              if m: return m.group(1)
              # Padrão alternativo: "url": "https://....m3u8"
              m = re.search(r'"url"\s*:\s*["\'](https?://[^"\']+\.(?:mp4|m3u8))["\']', html, re.I)
              if m: return m.group(1)
              # Fallback: qualquer URL .mp4/.m3u8
              m = re.search(r'(https?://[^"\']+\.(?:mp4|m3u8))', html, re.I)
              return m.group(1) if m else None

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  page = await ctx.new_page()

                  # 1. Pega o iframe do player na página principal
                  await page.goto(URL_ALVO, wait_until="domcontentloaded", timeout=30000)
                  await asyncio.sleep(2)
                  html = await page.content()
                  m = re.search(r'<iframe[^>]+src="([^"]*player3/server\.php[^"]*)"', html, re.I)
                  if not m:
                      log("[-] Iframe do player não encontrado.")
                      await browser.close(); return
                  player_url = m.group(1)
                  if player_url.startswith('/'):
                      player_url = BASE_URL + player_url
                  log(f"[+] Iframe: {player_url}")

                  # 2. Carrega a página do player e espera o JS rodar
                  page2 = await ctx.new_page()
                  await page2.goto(player_url, wait_until="domcontentloaded", timeout=20000)
                  await asyncio.sleep(5)  # tempo para o JS injetar o link

                  # 3. Extrai o link do HTML renderizado
                  html_render = await page2.content()
                  link = await extrair_do_html(html_render)

                  if link:
                      log(f"[+] Link encontrado: {link}")
                  else:
                      log("[-] Regex não encontrou link no HTML renderizado do player original.")
                      # 4. Fallback: tenta serverf4.php
                      url_f4 = player_url.replace("server.php", "serverf4.php")
                      log(f"[*] Tentando fallback: {url_f4}")
                      try:
                          await page2.goto(url_f4, wait_until="domcontentloaded", timeout=20000)
                          await asyncio.sleep(5)
                          html_f4 = await page2.content()
                          link = await extrair_do_html(html_f4)
                          if link:
                              log(f"[+] Link encontrado via serverf4.php: {link}")
                          else:
                              log("[-] Regex não encontrou link no serverf4.php.")
                      except Exception as e:
                          log(f"[-] Erro no fallback: {e}")

                  if not link:
                      log("\n[-] Nenhum link extraído. O player pode usar token dinâmico ou ofuscação JS.")
                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python3 /tmp/teste_v4.py
