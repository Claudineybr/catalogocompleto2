name: Teste Extracao RedeCanais (Iframe)

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Python e Playwright
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Extrair Link do Video
        run: |
          cat > /tmp/teste_redecanais_iframe.py << 'PYEOF'
          import asyncio, re, sys, requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          URL_ALVO = "https://redecanais.by/arrow-1a-temporada-episodio-01-piloto_530488a01.html"
          BASE_URL = "https://redecanais.by"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def extrair_do_html(html):
              # Padrão clássico do player3: file: "http://....mp4"
              m = re.search(r'file\s*:\s*["\'](https?://[^"\']+\.(?:mp4|m3u8))["\']', html, re.I)
              if m: return m.group(1)
              # Fallback: tag <video><source src="...">
              soup = BeautifulSoup(html, 'html.parser')
              for tag in soup.find_all(['video','source']):
                  src = tag.get('src')
                  if src and re.search(r'\.(mp4|m3u8)(\?|$)', src, re.I):
                      return src
              # Fallback: qualquer URL .mp4/.m3u8 no HTML
              m = re.search(r'(https?://[^"\']+\.(?:mp4|m3u8)[^"\']*)', html, re.I)
              return m.group(1) if m else None

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  page = await ctx.new_page()

                  # 1. Abre página principal e captura iframe do player
                  await page.goto(URL_ALVO, wait_until="domcontentloaded", timeout=30000)
                  await asyncio.sleep(2.0)
                  html = await page.content()
                  soup = BeautifulSoup(html, 'html.parser')
                  player_iframe = None
                  for iframe in soup.find_all('iframe'):
                      src = iframe.get('src','')
                      if 'player3/server.php' in src:
                          player_iframe = src
                          break

                  if not player_iframe:
                      log("[-] Iframe do player3 não encontrado.")
                      await browser.close(); return

                  if player_iframe.startswith('/'):
                      player_iframe = BASE_URL + player_iframe
                  log(f"[+] Iframe do player: {player_iframe}")

                  # 2. Tenta abrir o iframe no Playwright e interceptar rede
                  page2 = await ctx.new_page()
                  capturados = []
                  page2.on("response", lambda r: capturados.append(r.url) if re.search(r'\.(mp4|m3u8)(\?|$)', r.url, re.I) else None)
                  try:
                      await page2.goto(player_iframe, wait_until="domcontentloaded", timeout=20000)
                      await asyncio.sleep(5.0)  # espera o player carregar o vídeo
                  except Exception as e:
                      log(f"    [aviso] Playwright no iframe: {e}")
                  finally:
                      await page2.close()

                  if capturados:
                      log(f"[+] Capturado na rede: {capturados[0]}")
                      await browser.close()
                      return

                  # 3. Fallback: requests direto no iframe + regex
                  log("[-] Rede não capturou. Tentando requests + regex no HTML do iframe...")
                  try:
                      r = requests.get(player_iframe, headers={**HEADERS, "Referer": URL_ALVO}, timeout=15)
                      link = extrair_do_html(r.text)
                      if link:
                          log(f"[+] Extraído via regex: {link}")
                      else:
                          log("[-] Nenhum link encontrado no HTML do iframe.")
                  except Exception as e:
                      log(f"[-] Erro no requests: {e}")

                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python3 /tmp/teste_redecanais_iframe.py
