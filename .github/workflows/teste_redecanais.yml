name: Teste RedeCanais v6 (Biblioteca Redecanais)

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependências
        run: |
          pip install redecanais
          # A biblioteca pode ter dependências não listadas explicitamente
          pip install requests beautifulsoup4

      - name: Extrair link com a biblioteca redecanais
        run: |
          cat > /tmp/teste_redecanais_lib.py << 'PYEOF'
          import sys
          from redecanais.redecanais import ChannelsNetwork

          URL_ALVO = "https://redecanais.by/arrow-1a-temporada-episodio-01-piloto_530488a01.html"

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          def main():
              log(f"[+] Iniciando extração para: {URL_ALVO}")
              try:
                  cn = ChannelsNetwork()
                  # O método find_streams é o orquestrador que segue a cadeia de POSTs
                  resultado = cn.find_streams(URL_ALVO)
                  
                  if resultado and resultado.get('stream'):
                      link = resultado['stream']
                      log(f"\n[+] SUCESSO! Link do vídeo encontrado:")
                      log(f"    {link}")
                  else:
                      log("\n[-] A biblioteca não retornou um link válido.")
                      log(f"    Resultado: {resultado}")
              except Exception as e:
                  log(f"\n[-] Erro ao usar a biblioteca: {e}")
                  import traceback
                  traceback.print_exc()

          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/teste_redecanais_lib.py
