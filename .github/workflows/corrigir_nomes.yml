name: Corrigir Nomes e Sufixo

on:
  workflow_dispatch:
    inputs:
      remover_duplicatas:
        description: 'Remover duplicatas exatas?'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '**.html'
      - '.github/workflows/corrigir_nomes.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-nomes
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gravar o script Python (embutido)
        run: |
          cat > /tmp/corrigir_nomes.py << 'PYEOF'
          # -*- coding: utf-8 -*-
          import re, os, sys, json, html, time, glob, unicodedata, collections
          from pathlib import Path

          SUFIXO = "🍿Clau"
          DRY = (os.environ.get("DRY_RUN") or "0") == "1"
          REMOVER_DUPLICATAS = (os.environ.get("REMOVER_DUPLICATAS") or "0") == "1"

          # Remove o lixo do começo/meio do nome do arquivo (marc_sx7, vini7x, etc)
          LIXO_STEM = re.compile(r"(?:^|_)(?:marc_?[o0]?_?sx7|vini7x[a-z0-9]*|marc_sx7)(?=_|$)", re.I)
          
          # Remove tags do final do título (legendado, hdcam, etc)
          TAGS_FIM = re.compile(
              r'(?:\s*[-–—|]\s*)?\b(?:legendado|legendada|dublado|dublada|dublagem(?:\s+nao\s+oficial)?'
              r'|hdcam|hdrip|cam|leg|dub|nacional|completo|infantil|comedia|aventura|terror|suspense|acao|romance|drama'
              r'|ficcao\s+cientifica|acao\s+e\s+ficcao\s+cientifica)\b\s*$', re.I)

          RX_NAME = re.compile(r'("name":\s*")((?:[^"\\]|\\.)*)(")')
          RX_DESC = re.compile(r'("description":\s*")((?:[^"\\]|\\.)*)(")')
          RX_TITLE = re.compile(r"(<title>)([^<]*)(</title>)")
          RX_VTITLE = re.compile(r'(<video\b[^>]*?\btitle=")([^"]*)(")')
          RX_LINK = re.compile(r'"contentUrl":\s*"([^"]*)"')

          def slug(t):
              t = unicodedata.normalize("NFKD", str(t or ""))
              t = "".join(c for c in t if not unicodedata.combining(c))
              return re.sub(r"_+", "_", re.sub(r"[^a-z0-9]", "_", t.lower())).strip("_")

          def limpar_titulo(t):
              if not t:
                  return t
              for _ in range(3):
                  t = TAGS_FIM.sub("", t)
              return re.sub(r"\s+", " ", t).strip(" -–—|:")

          def ano_do_arquivo(f):
              # Pega QUALQUER ano de 4 dígitos no nome do arquivo, ignorando o resto
              m = re.findall(r"((?:19|20)\d{2})", f)
              return m[-1] if m else ""

          def nome_filme(base, dica_ano=""):
              ano, t = "", base
              
              # Tenta achar o ano no título do JSON-LD
              parens = re.findall(r"\(\s*((?:19|20)\d{2})\s*\)", t)
              if parens:
                  ano = parens[-1]
              else:
                  m = re.search(r"\s+((?:19|20)\d{2})\s*$", t)
                  if m: ano = m.group(1)
              
              # Se não achou, usa a dica (ano do nome do arquivo) na MARRA
              if not ano and dica_ano:
                  ano = dica_ano
                  
              # Arranca o ano do título
              if ano:
                  t = re.sub(r"\s*\(\s*" + re.escape(ano) + r"\s*\)", "", t)
                  t = re.sub(r"(?<!\d)" + re.escape(ano) + r"(?!\d)", "", t)
                  
              return re.sub(r"\s+", " ", t).strip(" -–—|:"), ano

          def ler_campos(texto):
              m = RX_NAME.search(texto)
              if not m: return None
              try: return json.loads('"' + m.group(2) + '"')
              except: return None

          def json_str(s):
              return json.dumps(s, ensure_ascii=False)[1:-1].replace("</", "<\\/")

          def _igual(bruto, esperado):
              try: return json.loads('"' + bruto + '"') == esperado
              except: return False

          def aplicar_conteudo(texto, nome, arq_antigo, arq_novo):
              orig = texto
              texto = RX_NAME.sub(lambda m: m.group(1) + (m.group(2) if _igual(m.group(2), nome) else json_str(nome)) + m.group(3), texto, 1)
              desc = "Assista " + nome
              texto = RX_DESC.sub(lambda m: m.group(1) + (m.group(2) if _igual(m.group(2), desc) else json_str(desc)) + m.group(3), texto, 1)
              texto = RX_TITLE.sub(lambda m: m.group(1) + (m.group(2) if html.unescape(m.group(2)) == nome else html.escape(nome)) + m.group(3), texto, 1)
              texto = RX_VTITLE.sub(lambda m: m.group(1) + (m.group(2) if html.unescape(m.group(2)) == nome else html.escape(nome)) + m.group(3), texto, 1)
              if arq_antigo != arq_novo:
                  texto = texto.replace("/" + arq_antigo, "/" + arq_novo)
              return texto, texto != orig

          def main():
              raiz = Path(".")
              arquivos = sorted(p.name for p in raiz.glob("*.html"))
              st = collections.Counter()
              renomeios, alterados, ignorados, conflitos = [], [], [], []
              textos = {f: (raiz / f).read_text(encoding="utf-8") for f in arquivos}
              
              existentes = set(arquivos)
              reservados = {}
              planos = {}

              for f in arquivos:
                  if f.startswith("abrir_player") or re.match(r"^tp\d+_e\d+", f):
                      planos[f] = {"skip": "arquivo auxiliar"}
                      continue
                  
                  nome_json = ler_campos(textos[f])
                  if not nome_json:
                      planos[f] = {"skip": "sem JSON-LD"}
                      continue

                  base = limpar_titulo(nome_json)
                  
                  # CASO SÉRIE
                  m_arq = re.search(r"_t(\d+)e(?:p)?(\d+)(?:_\d+)?\.html$", f, re.I)
                  m_nome = re.search(r"\bT(\d+)E(\d+)\b", base, re.I)
                  
                  if m_arq or m_nome:
                      t, e = (m_arq.group(1), m_arq.group(2)) if m_arq else (m_nome.group(1), m_nome.group(2))
                      serie = base.split("- T")[0].strip() if m_nome else base
                      tit = ""
                      if m_nome:
                          partes = re.split(r"[-–—]", base, maxsplit=1)
                          if len(partes) > 1: tit = partes[1].strip()
                      
                      stem = LIXO_STEM.sub("", f[:-5]).strip("_")
                      stem = re.sub(r"_t\d+e\d+.*", "", stem, flags=re.I)
                      if not stem: stem = slug(serie)
                      
                      planos[f] = {
                          "tipo": "serie",
                          "arquivo": f"{stem}_t{int(t):02d}ep{int(e):02d}.html",
                          "nome": f"{serie} - T{int(t)}E{int(e)}" + (f" – {tit}" if tit else "") + f" - {SUFIXO}"
                      }
                  
                  # CASO FILME
                  else:
                      # Arranca o ano do arquivo e limpa o título
                      titulo, ano = nome_filme(base, ano_do_arquivo(f))
                      titulo = limpar_titulo(titulo)
                      
                      if not titulo:
                          planos[f] = {"skip": "título vazio"}
                          continue
                          
                      novo_nome = f"{titulo} ({ano}) - {SUFIXO}" if ano else f"{titulo} - {SUFIXO}"
                      if ano:
                          novo_arquivo = f"{slug(titulo)}_{ano}.html"
                      else:
                          # Remove o marc_sx7 do nome mesmo sem ano
                          limpo = re.sub(r"_+", "_", LIXO_STEM.sub("", f[:-5])).strip("_") + ".html"
                          novo_arquivo = limpo if limpo != f else None
                          
                      planos[f] = {"tipo": "filme", "arquivo": novo_arquivo, "nome": novo_nome}

              for f in arquivos:
                  p = planos[f]
                  if "skip" in p:
                      ignorados.append((f, p["skip"]))
                      continue
                  
                  novo = p["arquivo"] or f
                  
                  if novo != f:
                      dono = novo if novo in existentes else reservados.get(novo)
                      if dono is None:
                          reservados[novo] = f
                      else:
                          # Já existe, mantém o nome atual pra não sobrescrever
                          conflitos.append((f, novo, "destino já existe"))
                          novo = f
                  
                  p["final"] = novo

              for f in arquivos:
                  p = planos[f]
                  if "skip" in p: continue
                  
                  novo = p["final"]
                  texto, mudou = aplicar_conteudo(textos[f], p["nome"], f, novo)
                  
                  if novo == f:
                      if mudou and not DRY:
                          (raiz / f).write_text(texto, encoding="utf-8")
                  else:
                      renomeios.append((f, novo))
                      if not DRY:
                          (raiz / novo).write_text(texto, encoding="utf-8")
                          (raiz / f).unlink()

              rel = [f"{a}  ->  {b}" for a, b in renomeios]
              Path("/tmp/relatorio_corrigir_nomes.txt").write_text(
                  "RENOMEADOS (antes -> depois)\n" + "\n".join(rel) +
                  "\n\nCONFLITOS (não renomeados)\n" + "\n".join(f"{a}  ->  {b}  [{m}]" for a, b, m in conflitos) +
                  "\n\nIGNORADOS\n" + "\n".join(f"{a}  [{m}]" for a, m in ignorados) + "\n", encoding="utf-8")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 -c "import ast;ast.parse(open('/tmp/corrigir_nomes.py').read());print('script ok')"

      - name: Corrigir, commitar e dar push
        env:
          REMOVER_DUPLICATAS: ${{ (inputs.remover_duplicatas == true || inputs.remover_duplicatas == 'true') && '1' || '0' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config diff.renameLimit 30000

          ok=0
          for tentativa in 1 2 3 4 5; do
            echo "=== Tentativa $tentativa ==="
            python3 /tmp/corrigir_nomes.py
            git add -A
            git reset .github/ 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Nada para commitar: tudo já está no padrão."
              ok=1; break
            fi

            git commit -m "chore: normaliza nomes e sufixo 🍿Clau"
            if git push origin HEAD:main; then ok=1; break; fi

            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$ok" != "1" ]; then echo "::error::Não consegui dar push"; exit 1; fi

      - name: Guardar relatório
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-corrigir-nomes
          path: /tmp/relatorio_corrigir_nomes.txt
          if-no-files-found: ignore
