name: Corrigir Nomes e Sufixo

on:
  workflow_dispatch:
    inputs:
      remover_duplicatas:
        description: 'Remover arquivos marc_sx7/vini7x que são duplicata EXATA de um arquivo limpo?'
        required: false
        default: false
        type: boolean
      buscar_anos_no_feed:
        description: 'Consultar o feed do site para descobrir o ano?'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '**.html'
      - '.github/workflows/corrigir_nomes.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-nomes
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gravar o script Python (embutido)
        run: |
          cat > /tmp/corrigir_nomes.py << 'PYEOF'
          # -*- coding: utf-8 -*-
          import re, os, sys, json, html, time, glob, unicodedata, collections
          from pathlib import Path

          SUFIXO = "🍿Clau"
          DRY = (os.environ.get("DRY_RUN") or "0") == "1"
          USAR_FEED = (os.environ.get("USAR_FEED") or "0") == "1"
          REMOVER_DUPLICATAS = (os.environ.get("REMOVER_DUPLICATAS") or "0") == "1"
          BASE_URL = "https://www.vini7xgrave.site"

          LIXO = re.compile(r"\U0001F47E+️?|(?:\bdo\s+)?@?vini\s*7x\w*|marc[øo_]\s*s\s*x\s*7\w*|marc_sx7\w*", re.I)
          LIXO_STEM = re.compile(r"(?:^|_)(?:marc_?[o0]?_?sx7|vini7x[a-z0-9]*)(?=_|$)", re.I)

          TAGS_FIM = re.compile(
              r'(?:\s*[-–—|]\s*)?\b(?:legendado|legendada|dublado|dublada|dublagem(?:\s+nao\s+oficial)?'
              r'|hdcam|hdrip|cam|leg|dub|nacional|completo|infantil|comedia|aventura|terror|suspense|acao|romance|drama'
              r'|ficcao\s+cientifica|acao\s+e\s+ficcao\s+cientifica)\b\s*$', re.I)

          AUX_RE = re.compile(r"^(?:abrir_player(?:_\d+)?|tp\d+_e\d+)\.html$", re.I)

          SERIE_ARQ = re.compile(r"^(?P<stem>.+?)_t(?P<t>\d+)e(?:p)?(?P<e>\d+)(?:_\d+)?\.html$", re.I)
          SERIE_NOME = re.compile(r"^(?P<serie>.*?)\s*(?:[-–—]\s*)?\bT(?P<t>\d+)E(?P<e>\d+)\b\s*(?:[-–—]\s*(?P<tit>.*))?$", re.I | re.S)
          PADRAO_FILME = re.compile(r"^[a-z0-9]+(?:_[a-z0-9]+)*_(?:19|20)\d{2}\.html$")
          PADRAO_SERIE = re.compile(r"^[a-z0-9]+(?:_[a-z0-9]+)*_t\d{2}ep\d{2}\.html$")

          RX_NAME = re.compile(r'("name":\s*")((?:[^"\\]|\\.)*)(")')
          RX_DESC = re.compile(r'("description":\s*")((?:[^"\\]|\\.)*)(")')
          RX_TITLE = re.compile(r"(<title>)([^<]*)(</title>)")
          RX_VTITLE = re.compile(r'(<video\b[^>]*?\btitle=")([^"]*)(")')
          RX_LINK = re.compile(r'"contentUrl":\s*"([^"]*)"')

          def slug(t):
              t = unicodedata.normalize("NFKD", str(t or ""))
              t = "".join(c for c in t if not unicodedata.combining(c))
              return re.sub(r"_+", "_", re.sub(r"[^a-z0-9]", "_", t.lower())).strip("_")

          def limpar_base(n):
              n = html.unescape(str(n or ""))
              nk = unicodedata.normalize("NFKC", n)
              if LIXO.search(nk) and not LIXO.search(n):
                  n = nk
              n = LIXO.sub(" ", n)
              n = re.sub(r"\s*[-–—]*\s*🍿\s*Clau\s*", " ", n, flags=re.I)
              n = re.sub(r"(?:\s*[-–—]\s*){2,}", " - ", n)
              n = re.sub(r"\s+", " ", n)
              return n.strip(" -–—|:")

          def limpar_titulo(t):
              if not t:
                  return t
              for _ in range(3): # Roda 3 vezes para limpar coisas como "HDCAM - LEG"
                  t = TAGS_FIM.sub("", t)
              t2 = re.sub(r"\s+", " ", t).strip(" -–—|:")
              return t2 if len(t2) >= 2 else t

          def ano_do_arquivo(f):
              m = re.findall(r"_((?:19|20)\d{2})(?=_|$)", f[:-5])
              return m[-1] if m else ""

          def nome_filme(base, dica_ano=""):
              ano, t = "", base
              parens = re.findall(r"\(\s*((?:19|20)\d{2})\s*\)", t)
              if parens:
                  ano = parens[-1]
              
              if not ano:
                  m = re.search(r"\s+((?:19|20)\d{2})\s*$", t)
                  if m:
                      ano = m.group(1)
              
              # A MÁGICA AQUI: Se não achou, usa a dica do arquivo (ano no nome) SEM RECLAMAR
              if not ano and dica_ano:
                  ano = dica_ano
                  
              if ano:
                  # Arranca o ano de qualquer lugar do titulo
                  t = re.sub(r"\s*\(\s*" + re.escape(ano) + r"\s*\)", "", t)
                  t = re.sub(r"(?<!\d)" + re.escape(ano) + r"(?!\d)", "", t)
                  
              t = re.sub(r"\s+", " ", t).strip(" -–—|:")
              return t, ano

          def montar_nome_serie(serie, t, e, tit):
              n = f"{serie} - T{int(t)}E{int(e)}"
              if tit:
                  n += f" – {tit}"
              return f"{n} - {SUFIXO}"

          def montar_nome_filme(titulo, ano):
              return f"{titulo} ({ano}) - {SUFIXO}" if ano else f"{titulo} - {SUFIXO}"

          def ler_campos(texto):
              m = RX_NAME.search(texto)
              if not m:
                  return None
              try:
                  return json.loads('"' + m.group(2) + '"')
              except Exception:
                  return None

          def planejar(f, texto, ano_feed=""):
              nome = ler_campos(texto)
              if nome is None:
                  return {"skip": "sem JSON-LD/name"}
              
              base = limpar_titulo(limpar_base(nome))
              m_nome = SERIE_NOME.match(base)
              m_arq = SERIE_ARQ.match(f)

              if m_nome or m_arq:
                  if m_arq and m_nome and (int(m_arq["t"]), int(m_arq["e"])) != (int(m_nome["t"]), int(m_nome["e"])):
                      return {"skip": f"arquivo T{int(m_arq['t'])}E{int(m_arq['e'])} x nome T{int(m_nome['t'])}E{int(m_nome['e'])}"}
                  if m_nome:
                      t, e = int(m_nome["t"]), int(m_nome["e"])
                      serie = limpar_titulo(m_nome["serie"].strip(" -–—|:"))
                      tit = limpar_titulo((m_nome["tit"] or "").strip(" -–—|:"))
                  else:
                      t, e = int(m_arq["t"]), int(m_arq["e"])
                      serie = limpar_titulo(base.strip(" -–—|:"))
                      tit = ""
                  if m_arq:
                      stem = LIXO_STEM.sub("", m_arq["stem"]).strip("_")
                      stem = re.sub(r"_+", "_", stem)
                  else:
                      stem = slug(serie)
                  if not stem:
                      return {"skip": "stem vazio"}
                  return {"tipo": "serie", "arquivo": f"{stem}_t{t:02d}ep{e:02d}.html",
                          "nome": montar_nome_serie(serie, t, e, tit)}

              titulo, ano = nome_filme(base, ano_do_arquivo(f) or ano_feed)
              titulo = limpar_titulo(titulo)
              if len(titulo) < 2:
                  return {"skip": "título vazio"}
              novo_nome = montar_nome_filme(titulo, ano)
              if not ano:
                  limpo = re.sub(r"_+", "_", LIXO_STEM.sub("", f[:-5])).strip("_") + ".html"
                  return {"tipo": "filme_sem_ano", "arquivo": limpo if limpo != f and len(limpo) > 5 else None, "nome": novo_nome}
              return {"tipo": "filme", "arquivo": f"{slug(titulo)}_{ano}.html", "nome": novo_nome}

          def json_str(s):
              return json.dumps(s, ensure_ascii=False)[1:-1].replace("</", "<\\/")

          def aplicar_conteudo(texto, nome, arq_antigo, arq_novo):
              orig = texto
              texto = RX_NAME.sub(lambda m: m.group(1) + (m.group(2) if _igual(m.group(2), nome) else json_str(nome)) + m.group(3), texto, 1)
              desc = "Assista " + nome
              texto = RX_DESC.sub(lambda m: m.group(1) + (m.group(2) if _igual(m.group(2), desc) else json_str(desc)) + m.group(3), texto, 1)
              texto = RX_TITLE.sub(lambda m: m.group(1) + (m.group(2) if html.unescape(m.group(2)) == nome else html.escape(nome)) + m.group(3), texto, 1)
              texto = RX_VTITLE.sub(lambda m: m.group(1) + (m.group(2) if html.unescape(m.group(2)) == nome else html.escape(nome)) + m.group(3), texto, 1)
              if arq_antigo != arq_novo:
                  texto = texto.replace("/" + arq_antigo, "/" + arq_novo)
              return texto, texto != orig

          def _igual(bruto, esperado):
              try:
                  return json.loads('"' + bruto + '"') == esperado
              except Exception:
                  return False

          def anos_do_feed():
              if not USAR_FEED:
                  return {}
              import urllib.request, urllib.error
              por_link = collections.defaultdict(set)
              start = 1
              try:
                  while True:
                      url = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      try:
                          feed = json.loads(urllib.request.urlopen(req, timeout=30).read().decode("utf-8")).get("feed", {})
                      except urllib.error.HTTPError:
                          break
                      ents = feed.get("entry", []) or []
                      for e in ents:
                          titulo = unicodedata.normalize("NFKC", (e.get("title") or {}).get("$t", ""))
                          corpo = (e.get("content") or {}).get("$t", "")
                          m = re.search(r"\(\s*((?:19|20)\d{2})\s*\)\s*$|\s((?:19|20)\d{2})\s*$", titulo.strip())
                          ano = (m.group(1) or m.group(2)) if m else ""
                          for lk in re.findall(r'"contentUrl":\s*"([^"]+)"', corpo):
                              por_link[lk].add(ano)
                      if len(ents) < 150:
                          break
                      start += 150
                      time.sleep(15)
              except Exception:
                  return {}
              return {lk: next(iter(a)) for lk, a in por_link.items() if len(a) == 1 and next(iter(a))}

          def main():
              raiz = Path(".")
              arquivos = sorted(p.name for p in raiz.glob("*.html"))
              st = collections.Counter()
              renomeios, alterados, ignorados, conflitos = [], [], [], []
              textos = {f: (raiz / f).read_text(encoding="utf-8") for f in arquivos}
              st["lidos"] = len(arquivos)

              ano_por_link = {}
              precisa = [f for f in arquivos if not AUX_RE.match(f) and not PADRAO_FILME.match(f) and not PADRAO_SERIE.match(f) and not ano_do_arquivo(f)]
              if precisa:
                  ano_por_link = anos_do_feed()

              planos = {}
              for f in arquivos:
                  if AUX_RE.match(f):
                      planos[f] = {"skip": "arquivo auxiliar/fora do padrão"}
                      continue
                  lk = RX_LINK.search(textos[f])
                  ano_feed = ano_por_link.get(lk.group(1), "") if lk else ""
                  planos[f] = planejar(f, textos[f], ano_feed)

              existentes = set(arquivos)
              reservados = {}
              mapa, duplicatas = {}, []

              def link_de(nome_arq):
                  m = RX_LINK.search(textos.get(nome_arq, ""))
                  return m.group(1) if m else None

              for f in arquivos:
                  p = planos[f]
                  if "skip" in p:
                      ignorados.append((f, p["skip"]))
                      continue
                  novo = p["arquivo"] or f
                  if novo != f:
                      dono = novo if novo in existentes else reservados.get(novo)
                      if dono is None:
                          reservados[novo] = f
                          mapa[f] = novo
                      else:
                          lk_a, lk_b = link_de(f), link_de(dono)
                          if lk_a and lk_a == lk_b:
                              duplicatas.append((f, novo))
                              conflitos.append((f, novo, f"DUPLICATA do mesmo vídeo de {dono}"))
                              novo = f
                          elif re.fullmatch(re.escape(novo[:-5]) + r"_\d+\.html", f):
                              ignorados.append((f, f"mantido desambiguado; canônico {novo} é outro vídeo"))
                              novo = f
                          elif p["tipo"] in ("filme", "filme_sem_ano") and LIXO_STEM.search(f[:-5]):
                              base = novo[:-5]
                              n = 2
                              while f"{base}_{n}.html" in existentes or f"{base}_{n}.html" in reservados:
                                  n += 1
                              novo = f"{base}_{n}.html"
                              reservados[novo] = f
                              mapa[f] = novo
                          else:
                              conflitos.append((f, novo, "destino já existe com OUTRO vídeo" if novo in existentes else "outro arquivo já vai para este destino"))
                              novo = f
                  p["final"] = novo

              for f in arquivos:
                  p = planos[f]
                  if "skip" in p:
                      continue
                  novo = p["final"]
                  texto, mudou = aplicar_conteudo(textos[f], p["nome"], f, novo)
                  if mudou:
                      alterados.append(f)
                  if novo == f:
                      if mudou and not DRY:
                          (raiz / f).write_text(texto, encoding="utf-8")
                  else:
                      renomeios.append((f, novo))
                      if not DRY:
                          (raiz / novo).write_text(texto, encoding="utf-8")
                          (raiz / f).unlink()
                  if p["tipo"] == "filme_sem_ano" and novo == f:
                      ignorados.append((f, "filme sem ano conhecido (não invento ano)"))

              removidas, mapa_aux = [], dict(mapa)
              if REMOVER_DUPLICATAS and not DRY:
                  for f, destino in duplicatas:
                      alvo = raiz / destino
                      if not alvo.exists() or LIXO_STEM.search(destino[:-5]):
                          continue
                      m = RX_LINK.search(alvo.read_text(encoding="utf-8"))
                      if m and link_de(f) == m.group(1):
                          (raiz / f).unlink()
                          removidas.append(f)
                          mapa_aux[f] = destino

              if mapa_aux and not DRY:
                  aux = list(raiz.glob("relatorio_*.txt")) + [raiz / "filmes_pendentes.json", raiz / "episodios_pendentes.json"]
                  for a in aux:
                      if not a.exists():
                          continue
                      t0 = a.read_text(encoding="utf-8")
                      t1 = re.sub(r"[A-Za-z0-9_]+\.html", lambda m: mapa_aux.get(m.group(0), m.group(0)), t0)
                      if a.suffix == ".json":
                          stems = {v[:-5]: n[:-5] for v, n in mapa_aux.items()}
                          t1 = re.sub(r'"([a-z0-9_]+)"', lambda m: '"' + stems.get(m.group(1), m.group(1)) + '"', t1)
                      if t1 != t0:
                          a.write_text(t1, encoding="utf-8")

              st["renomeados"], st["conteudo_alterado"] = len(renomeios), len(alterados)
              st["ignorados"], st["conflitos_de_nome"] = len(ignorados), len(conflitos)
              st["duplicatas_exatas"], st["duplicatas_removidas"] = len(duplicatas), len(removidas)

              rel = [f"{a}  ->  {b}" for a, b in renomeios]
              Path(os.environ.get("RELATORIO") or "/tmp/relatorio_corrigir_nomes.txt").write_text(
                  "RENOMEADOS (antes -> depois)\n" + "\n".join(rel) +
                  "\n\nCONFLITOS (não renomeados, nada foi apagado)\n" + "\n".join(f"{a}  ->  {b}  [{m}]" for a, b, m in conflitos) +
                  "\n\nREMOVIDAS (duplicata exata, REMOVER_DUPLICATAS=1)\n" + "\n".join(removidas) + "\n\nIGNORADOS\n" + "\n".join(f"{a}  [{m}]" for a, m in ignorados) + "\n", encoding="utf-8")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 -c "import ast;ast.parse(open('/tmp/corrigir_nomes.py').read());print('script ok')"

      - name: Corrigir, commitar e dar push
        env:
          USAR_FEED: ${{ (inputs.buscar_anos_no_feed == true || inputs.buscar_anos_no_feed == 'true') && '1' || '0' }}
          REMOVER_DUPLICATAS: ${{ (inputs.remover_duplicatas == true || inputs.remover_duplicatas == 'true') && '1' || '0' }}
          RELATORIO: /tmp/relatorio_corrigir_nomes.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config diff.renameLimit 30000

          ok=0
          for tentativa in 1 2 3 4 5; do
            echo "=== Tentativa $tentativa ==="
            python3 /tmp/corrigir_nomes.py
            git add -A
            git reset .github/ 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Nada para commitar: tudo já está no padrão."
              ok=1; break
            fi

            git commit -m "chore: normaliza nomes e sufixo 🍿Clau"
            if git push origin HEAD:main; then ok=1; break; fi

            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$ok" != "1" ]; then echo "::error::Não consegui dar push"; exit 1; fi

      - name: Guardar relatório
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-corrigir-nomes
          path: /tmp/relatorio_corrigir_nomes.txt
          if-no-files-found: ignore
