name: Corrigir Nomes e Sufixo

on:
  workflow_dispatch:
    inputs:
      remover_duplicatas:
        description: 'Remover duplicatas exatas?'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '**.html'
      - '.github/workflows/corrigir_nomes.yml'

permissions:
  contents: write

concurrency:
  group: corrigir-nomes
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gravar o script Python (embutido)
        run: |
          cat > /tmp/corrigir_nomes.py << 'PYEOF'
          # -*- coding: utf-8 -*-
          import re, os, json, html, unicodedata
          from pathlib import Path

          SUFIXO = "🍿Clau"
          DRY = (os.environ.get("DRY_RUN") or "0") == "1"
          REMOVER_DUPLICATAS = (os.environ.get("REMOVER_DUPLICATAS") or "0") == "1"

          RX_NAME = re.compile(r'("name":\s*")((?:[^"\\]|\\.)*)(")')
          RX_DESC = re.compile(r'("description":\s*")((?:[^"\\]|\\.)*)(")')
          RX_TITLE = re.compile(r"(<title>)([^<]*)(</title>)")
          RX_VTITLE = re.compile(r'(<video\b[^>]*?\btitle=")([^"]*)(")')
          RX_LINK = re.compile(r'"contentUrl":\s*"([^"]*)"')

          AUX_FILES = ("abrir_player.html", "abrir_player_2.html", "abrir_player_3.html", "abrir_player_4.html", "tp1_e06.html", "tp1_e07.html", "tp1_e08.html", "tp6_e17.html")

          def slug(t):
              t = unicodedata.normalize("NFKD", str(t or ""))
              t = "".join(c for c in t if not unicodedata.combining(c))
              return re.sub(r"_+", "_", re.sub(r"[^a-z0-9]", "_", t.lower())).strip("_")

          def limpar_tudo(texto):
              """Faxina pesada: remove marc_sx7, _clau, _20 e retorna o texto limpo."""
              if not texto: return ""
              t = html.unescape(texto)
              
              # 1. Remove o lixo _20 ou _19 no final (bug do script antigo)
              t = re.sub(r"[\s_-]+(?:19|20)$", "", t)
              
              # 2. Remove marc_sx7, marcøsx7, vini7x, etc. de qualquer lugar
              t = re.sub(r"(?i)marc[øo_]?s?x?7[\s_-]*", " ", t)
              t = re.sub(r"(?i)vini7x[\s_-]*", " ", t)
              
              # 3. Remove o sufixo 🍿Clau (com ou sem emoji, com ou sem traços)
              t = re.sub(r"(?i)[\s_-]*🍿?[\s_-]*clau\b", " ", t)
              t = re.sub(r"(?i)[\s_-]*🍿?[\s_-]*clau[\s_-]*", " ", t)
              
              # 4. Remove traços duplos soltos (-- virou -)
              t = re.sub(r"(?:\s*[-–—]\s*){2,}", " - ", t)
              
              # 5. Limpa espaços extras
              t = re.sub(r"\s+", " ", t)
              return t.strip(" -–—|:")

          def main():
              raiz = Path(".")
              arquivos = sorted(p.name for p in raiz.glob("*.html"))
              planos = {}
              
              # 1. Analisar e limpar tudo
              for f in arquivos:
                  if f in AUX_FILES:
                      continue
                  
                  try:
                      txt = (raiz / f).read_text(encoding="utf-8")
                  except:
                      continue

                  # Pega o nome do JSON
                  m = RX_NAME.search(txt)
                  nome_json = ""
                  if m:
                      try:
                          nome_json = json.loads('"' + m.group(2) + '"')
                      except:
                          pass

                  # Aplica a limpeza no JSON e no Nome do Arquivo
                  base_json = limpar_tudo(nome_json)
                  base_file = limpar_tudo(f[:-5]) # remove .html

                  # Verifica se é série (T1E1, T01E01, etc) no JSON ou no nome do arquivo
                  m_serie = re.search(r"(?i)\bT(\d+)[\s_-]*E(?:P)?(\d+)\b", base_json)
                  if not m_serie:
                      m_serie = re.search(r"(?i)\bT(\d+)[\s_-]*E(?:P)?(\d+)\b", base_file)
                      
                  if m_serie:
                      t, e = int(m_serie.group(1)), int(m_serie.group(2))
                      
                      # Tenta pegar o nome da série do JSON, se não tiver, usa o do arquivo
                      serie_raw = base_json[:m_serie.start()].strip()
                      if not serie_raw: serie_raw = base_file[:m_serie.start()].strip()
                      serie_clean = limpar_tudo(serie_raw).strip(" -_|:")
                      
                      # Tenta pegar o título do episódio
                      tit_raw = base_json[m_serie.end():].strip(" -_|:")
                      tit_clean = limpar_tudo(tit_raw).strip(" -_|:")
                      
                      novo_nome = f"{serie_clean} - T{t}E{e}"
                      if tit_clean: novo_nome += f" – {tit_clean}"
                      novo_nome += f" - {SUFIXO}"
                      novo_arquivo = f"{slug(serie_clean)}_t{t:02d}ep{e:02d}.html"
                      
                  else:
                      # É filme. Pega o ano do JSON, se não tiver, pega do nome do arquivo
                      anos_json = re.findall(r"\b((?:19|20)\d{2})\b", base_json)
                      anos_file = re.findall(r"\b((?:19|20)\d{2})\b", base_file)
                      
                      ano = ""
                      if anos_json: ano = anos_json[-1]
                      elif anos_file: ano = anos_file[-1]
                      
                      # Define o título base
                      titulo = base_json
                      if not titulo: titulo = base_file
                      
                      # Arranca o ano do título
                      if ano:
                          partes = re.split(r"\b" + ano + r"\b", titulo)
                          titulo = partes[0].strip(" -_|:()")
                          
                      titulo = limpar_tudo(titulo).strip(" -_|:()")
                      if not titulo: titulo = "Filme"
                      
                      if ano:
                          novo_arquivo = f"{slug(titulo)}_{ano}.html"
                          novo_nome = f"{titulo} ({ano}) - {SUFIXO}"
                      else:
                          novo_arquivo = f"{slug(titulo)}.html"
                          novo_nome = f"{titulo} - {SUFIXO}"

                  planos[f] = {
                      "novo_arquivo": novo_arquivo,
                      "novo_nome": novo_nome,
                      "txt": txt,
                      "link": (RX_LINK.search(txt).group(1) if RX_LINK.search(txt) else "")
                  }

              # 2. Resolver conflitos e duplicatas
              reservados = {}
              for f, p in planos.items():
                  novo = p["novo_arquivo"]
                  if f == novo: continue
                  
                  if novo in arquivos or novo in reservados:
                      dono = novo if novo in planos else reservados[novo]
                      if p["link"] and planos.get(dono, {}).get("link") == p["link"]:
                          p["status"] = "duplicata"
                          p["dono"] = dono
                      else:
                          base_nome = novo[:-5]
                          n = 2
                          while f"{base_nome}_{n}.html" in arquivos or f"{base_nome}_{n}.html" in reservados:
                              n += 1
                          p["novo_arquivo"] = f"{base_nome}_{n}.html"
                          reservados[p["novo_arquivo"]] = f
                  else:
                      reservados[novo] = f
                      p["status"] = "renomear"

              # 3. Aplicar mudanças e renomear
              for f, p in planos.items():
                  txt = p["txt"]
                  novo_nome = p["novo_nome"]
                  
                  def _eq(a, b):
                      try: return json.loads('"' + a + '"') == b
                      except: return False
                  def get_fmt(s): return json.dumps(s, ensure_ascii=False)[1:-1].replace("</", "<\\/")

                  # Atualiza os metadados no HTML
                  txt = RX_NAME.sub(lambda x: x.group(1) + (x.group(2) if _eq(x.group(2), novo_nome) else get_fmt(novo_nome)) + x.group(3), txt, 1)
                  txt = RX_DESC.sub(lambda x: x.group(1) + (x.group(2) if _eq(x.group(2), "Assista " + novo_nome) else get_fmt("Assista " + novo_nome)) + x.group(3), txt, 1)
                  txt = RX_TITLE.sub(lambda x: x.group(1) + (x.group(2) if html.unescape(x.group(2)) == novo_nome else html.escape(novo_nome)) + x.group(3), txt, 1)
                  txt = RX_VTITLE.sub(lambda x: x.group(1) + (x.group(2) if html.unescape(x.group(2)) == novo_nome else html.escape(novo_nome)) + x.group(3), txt, 1)

                  status = p.get("status", "ok")
                  
                  if status == "duplicata":
                      if REMOVER_DUPLICATAS and not DRY:
                          (raiz / f).unlink()
                  elif status == "renomear":
                      novo = p["novo_arquivo"]
                      txt = txt.replace(f"/{f}", f"/{novo}")
                      if not DRY:
                          (raiz / novo).write_text(txt, encoding="utf-8")
                          (raiz / f).unlink()
                  else:
                      if not DRY:
                          (raiz / f).write_text(txt, encoding="utf-8")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 -c "import ast;ast.parse(open('/tmp/corrigir_nomes.py').read());print('script ok')"

      - name: Corrigir, commitar e dar push
        env:
          REMOVER_DUPLICATAS: "1"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config diff.renameLimit 30000

          ok=0
          for tentativa in 1 2 3 4 5; do
            echo "=== Tentativa $tentativa ==="
            python3 /tmp/corrigir_nomes.py
            git add -A
            git reset .github/ 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Nada para commitar: tudo já está no padrão."
              ok=1; break
            fi

            git commit -m "fix: limpa marc_sx7, corrige anos e remove lixo dos nomes"
            if git push origin HEAD:main; then ok=1; break; fi

            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$ok" != "1" ]; then echo "::error::Não consegui dar push"; exit 1; fi
